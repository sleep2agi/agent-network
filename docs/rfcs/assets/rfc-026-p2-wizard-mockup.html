<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>RFC-026 P2 — Create Node (v3 ultra-minimal)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 56px 24px;
    font: 15px/1.6 -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
    background: #0b0b0d; color: #e5e7eb;
    min-height: 100vh;
  }
  .wrap {
    max-width: 480px; margin: 0 auto;
  }
  h1 {
    font-size: 22px; font-weight: 600; margin: 0 0 32px;
  }
  .field { margin-bottom: 20px; }
  .label {
    font-size: 12px; color: #6b7280; margin-bottom: 6px;
  }
  .input, .pick {
    width: 100%; padding: 12px 14px;
    background: #161618; color: #e5e7eb;
    border: 1px solid #2a2a30; border-radius: 10px;
    font: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
  }
  .input:focus, .pick:focus { outline: none; border-color: #3b82f6; }
  .pick.open { border-color: #3b82f6; }
  .caret { color: #6b7280; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; margin-right: 8px;
    display: inline-block; flex-shrink: 0;
  }
  .dot.green { background: #34d399; }
  .dot.yellow { background: #fbbf24; }

  /* Dropdown items (shown for Model to demonstrate reachability) */
  .menu {
    background: #161618; border: 1px solid #3b82f6; border-radius: 10px;
    margin-top: 6px; overflow: hidden;
  }
  .item {
    padding: 11px 14px; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
  }
  .item:hover { background: #1e293b22; }
  .item.on { background: #1e293b; color: #93c5fd; }
  .item.dis {
    color: #4b5563; cursor: not-allowed; background: transparent;
  }
  .item.dis:hover { background: transparent; }
  .item .why {
    font-size: 11px; color: #6b7280;
  }
  .item + .item { border-top: 1px solid #1f1f24; }

  .adv {
    color: #6b7280; font-size: 13px; margin-top: 8px; cursor: pointer;
    user-select: none;
  }
  .adv:hover { color: #9ca3af; }

  .actions {
    margin-top: 36px;
    display: flex; gap: 12px; justify-content: flex-end;
  }
  .btn {
    padding: 11px 22px; border-radius: 10px; border: 1px solid #3b82f6;
    background: #3b82f6; color: white; font: inherit; cursor: pointer;
  }
  .btn.ghost {
    background: transparent; color: #9ca3af; border-color: #2a2a30;
  }

  .footnote {
    color: #4b5563; font-size: 11px; text-align: center;
    margin-top: 56px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>创建节点</h1>

  <div class="field">
    <div class="label">服务器</div>
    <div class="pick">
      <span><span class="dot green"></span> my-server-01 · 上海</span>
      <span class="caret">▾</span>
    </div>
  </div>

  <div class="field">
    <div class="label">名字</div>
    <input class="input" type="text" value="demo-bot" style="cursor: text;">
  </div>

  <div class="field">
    <div class="label">Runtime</div>
    <div class="pick">
      <span>claude-agent-sdk</span>
      <span class="caret">▾</span>
    </div>
  </div>

  <div class="field">
    <div class="label">Model</div>
    <div class="pick open">
      <span>claude-opus-4-7</span>
      <span class="caret">▴</span>
    </div>
    <div class="menu">
      <div class="item on">claude-opus-4-7</div>
      <div class="item">claude-sonnet-4-6</div>
      <div class="item dis">gpt-5-turbo <span class="why">不可达</span></div>
      <div class="item dis">deepseek-v4-pro <span class="why">不可达</span></div>
    </div>
  </div>

  <div class="adv">▸ 高级</div>

  <div class="actions">
    <button class="btn ghost">取消</button>
    <button class="btn">创建</button>
  </div>

  <div class="footnote">
    count = 1 路径同此 (服务器已自动填) · count = 0 整页换成「装 daemon」引导
  </div>
</div>
</body>
</html>
