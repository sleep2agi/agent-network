name: Docker E2E Tests

on:
  # 🔴 `branches: [main]` 不是可选的装饰 —— 没有它,这个 workflow 会在**任何**分支
  # 的 push 上跑,于是每个 PR 都跑两遍:一遍 push、一遍 pull_request。
  #
  # 实测(2026-08-17,同一分支 fix/909-help-text-agent-node):run #2327 与 #2328
  # 是同一个 commit 的两次完整 e2e,各约 10 分钟,结论相同。
  #
  # 三个代价:
  #   1. 全仓最贵的 job 跑两遍;
  #   2. PR 的等待时间由「最慢的一次」变成「两次都跑完」——合并前要多等一轮;
  #   3. 两次都产出名为 `e2e` 的 check,**分支保护的 required check 只能按名字指定**,
  #      两个同名 run 让「哪一个必须绿」无法确定。这和 #916 修掉的四个 job 都叫
  #      `scan` 是同一类问题,只是这次重名发生在同一个 workflow 的两个触发器之间。
  #
  # 仓里其它 workflow(qa.yml / action-pins.yml / lint-from-session.yml …)的 push
  # 触发器全部写了 `branches: [main]`,只有这个漏了。
  push:
    branches: [main]
    paths:
      - 'agent-network/**'
      - 'agent-node/**'
      - 'server/**'
      - 'channel/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'agent-network/**'
      - 'agent-node/**'
      - 'server/**'
      - 'tests/**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install agent-network dependencies
        working-directory: agent-network
        run: bun install --frozen-lockfile

      - name: Typecheck agent-network
        working-directory: agent-network
        run: bun tsc --noEmit

      - name: Build Docker E2E image
        run: docker build -t anet-e2e -f tests/Dockerfile .
        timeout-minutes: 10

      - name: Verify full-regression hard gate contract
        run: |
          docker run --rm \
            -e ROOT=/repo \
            -v "$PWD:/repo:ro" \
            anet-e2e \
            bash /repo/tests/test292-e2e-hard-gate/run.sh
        timeout-minutes: 2

      # #292 restored the legacy fixtures to current identity/auth contracts.
      # Preserve the Docker runner's real exit status across tee, then make the
      # following step enforce both that status and the structured TOTAL line.
      - name: Run full regression (hard-gated)
        # id 供下面的 verdict 区分「跑了但没产出退出码」与「压根没轮到它跑」。
        id: run
        run: |
          bash tests/lib/run-piped-command.sh \
            /tmp/e2e-output.log \
            /tmp/e2e-exit-code \
            docker run --rm anet-e2e /app/test-all.sh
        # The now-restored Loop suites intentionally include real 60-second
        # scheduler windows plus cooldown checks. Five minutes killed a valid
        # complete run before it could emit the Final Report.
        timeout-minutes: 12

      - name: Enforce full regression verdict
        if: always()
        run: |
          set -e
          echo
          echo "════════════════════════════════════════════════════════════"
          echo "  Docker E2E verdict (hard gate)"
          echo "════════════════════════════════════════════════════════════"
          # Pull the Final Report block + TOTAL line so the verdict is
          # visible in the Actions UI without expanding the run-step log.
          if [ -s /tmp/e2e-output.log ]; then
            awk '/Final Report/,/^$/' /tmp/e2e-output.log | tail -20
          fi
          # 这一步是 if: always(),所以前面任何一步失败时它也会跑。
          # 缺 exit-code 文件有两种完全不同的原因,旧文案把它们混成一句
          #   "test timed out or did not start"
          # —— 读到的人会去查测试超时,而真因往往在两三步之前
          # (实测:Setup Bun 从 GitHub releases 拉 bun 时 503,见 #746)。
          # 这里用 steps.run.outcome 把两种情况分开报。
          if [ ! -s /tmp/e2e-exit-code ]; then
            case "${{ steps.run.outcome }}" in
              skipped)
                echo "::error::the regression step never ran — an earlier step in this job failed."
                echo "::error::Look ABOVE this step (Setup Bun / dependency install / docker build), not at the tests."
                echo "::error::This is NOT a test timeout."
                ;;
              *)
                echo "::error::the regression step ran (outcome: ${{ steps.run.outcome }}) but produced no exit-code file"
                echo "::error::— it timed out or was killed. Check the 12-minute step timeout and the tail of the run log."
                ;;
            esac
            exit 1
          fi
          bash tests/lib/e2e-hard-gate.sh \
            /tmp/e2e-output.log \
            "$(cat /tmp/e2e-exit-code)"

  rename-ghost-gate:
    # #180 regression gate — standalone HARD FAIL for a focused signal.
    #
    # The rename-ghost test suite (`tests/qa-180-rename-ghost/`) reproduces the
    # exact ghost-process shape that #374 fixed: rename --force on a running
    # claude-code-cli node → old process + its MCP stdio subprocess must ALL
    # be reaped, and `/api/status` must lose the old alias immediately.
    #
    # Why this remains its own gate rather than relying only on the aggregate:
    #   - The fix relies on `sweepMcpOrphansForAlias` scanning
    #     `/proc/<pid>/environ` for `COMMHUB_ALIAS=<oldAlias>`. Delete that
    #     sweep or narrow its match set and the ghost silently returns.
    #   - The mock claude binary in this suite can NEVER prove real-vendor
    #     behaviour (mock ≠ real claude-code-cli), but #374 was originally
    #     gated on a real-ghost reproduction — so if the sweep code path
    #     still catches the mock's env-carrying subprocess (as it does
    #     today, PASS=13/FAIL=0 evidence in docs/tests/p-180-verify/
    #     rerun-postfix.txt), any future regression in that code path will
    #     surface here before it hits a real user.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build rename-ghost image
        run: docker build -t anet-qa180 -f tests/qa-180-rename-ghost/Dockerfile .
        timeout-minutes: 10

      - name: Run rename-ghost e2e
        id: run
        run: |
          set -o pipefail   # so ${PIPESTATUS[0]} below is docker's, not tee's
          set +e            # keep going even on non-zero — we surface it below
          docker run --rm --tmpfs /tmp:rw,exec anet-qa180 2>&1 | tee /tmp/qa180-out.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          # rc is the runner script's exit code. FAIL count is the "FAIL=N"
          # trailer from run.sh. Both must be zero for a clean pass.
          fail_line=$(grep -E 'PASS=[0-9]+ FAIL=[0-9]+' /tmp/qa180-out.log | tail -1)
          echo "trailer_line=$fail_line" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Gate on ghost count = 0
        run: |
          set -e
          line='${{ steps.run.outputs.trailer_line }}'
          rc='${{ steps.run.outputs.exit_code }}'
          echo "trailer: $line"
          echo "runner exit code: $rc"
          # Parse FAIL=N from the trailer.
          fails=$(echo "$line" | grep -oE 'FAIL=[0-9]+' | cut -d= -f2)
          fails=${fails:-999}
          if [ -z "$line" ]; then
            echo "::error::rename-ghost runner did not produce a trailer line — treat as regression."
            exit 1
          fi
          if [ "$fails" -gt 0 ]; then
            echo "::error::rename-ghost regression: FAIL=$fails (any FAIL > 0 = ghost process reproduced)."
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            echo "::error::rename-ghost runner exited non-zero ($rc) despite FAIL=0 — infra issue worth surfacing."
            exit 1
          fi
          echo "PASS: no ghost detected across both CASE A + B."
