name: HTTP baseline corrections (TEST-ONLY)
on:
  pull_request:
    paths:
      - 'server/src/host-supervisor-identity-http.test.ts'
      - 'server/src/observer-avatar-http.test.ts'
      - 'server/src/requirements-http.test.ts'
      - 'tests/test1109-supervisor-identity/*1201*'
      - '.github/workflows/qa-baseline1201.yml'
  workflow_dispatch:
permissions:
  contents: read
# #2136 —— 同一 PR 重新 push 时**取消上一轮还在排队的运行**。
# 2026-10-25 实测:一条 PR 反复 push 会留下 28 个过期 workflow 一直占着 runner 队列,
# 新提交反而排不上(当天三条 PR 全卡在 queued)。只在 pull_request 上取消:
# 主分支的 push 运行不取消 —— 那可能是发布/部署门。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  baseline-and-fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build exact-source fixture with verified selected baseline blobs
        run: sg docker -c 'docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" -f tests/test1109-supervisor-identity/Dockerfile.qa1201 -t http-baseline1201 .'
      - name: Reproduce baseline assertions, then all three corrected HTTP files
        run: |
          set -euo pipefail
          sg docker -c 'docker run --rm --network none -e EXPECTED_SOURCE_COMMIT="$GITHUB_SHA" http-baseline1201' 2>&1 | tee report-test1201-http-baseline.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TEST-ONLY-http-baseline1201-${{ github.sha }}
          path: report-test1201-http-baseline.txt
          if-no-files-found: warn
