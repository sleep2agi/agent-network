name: V1 default SAFE topology
on:
  pull_request:
    paths:
      - 'agent-node/src/runtime/opencode-acp/child-env.ts'
      - 'agent-node/src/runtime/opencode-copresence/runtime.ts'
      - 'agent-node/src/runtime/opencode-copresence/v1-checkpoint*.ts'
      - 'agent-node/src/runtime/opencode-acp/binary.ts'
      - 'agent-node/src/runtime/opencode-backend.ts'
      - 'agent-node/src/runtime/opencode-versions.ts'
      - 'agent-node/src/shared/opencode-preset.ts'
      - 'tests/test1246-v1-safe-topology/**'
      - 'tests/test1194-v1-shared-feasibility/package-integrity.json'
      - '.github/workflows/v1-safe-topology.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  topology:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        version: ['1.18.1', '1.18.34']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build exact pinned default-wrapper fixture
        run: docker build --build-arg OPENCODE_VERSION=${{ matrix.version }} --build-arg SOURCE_COMMIT=${{ github.sha }} -f tests/test1246-v1-safe-topology/Dockerfile -t v1-safe-topology-test .
      - name: Read actual empty session/config and lifecycle boundaries
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --init --network none -e EXPECTED_SOURCE_COMMIT=${{ github.sha }} v1-safe-topology-test 2>&1 | tee report-test1246-${{ matrix.version }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TEST-ONLY-v1-safe-topology-${{ matrix.version }}-${{ github.sha }}
          path: report-test1246-${{ matrix.version }}.txt
