name: V1 SAFE retention request observation
on:
  pull_request:
    paths:
      - 'agent-node/src/runtime/opencode-acp/child-env.ts'
      - 'agent-node/src/runtime/opencode-copresence/runtime.ts'
      - 'agent-node/src/runtime/opencode-copresence/v1-checkpoint*.ts'
      - 'agent-node/src/runtime/opencode-copresence/v1-owned-safe-topology.ts'
      - 'agent-node/src/runtime/opencode-copresence/v1-safe-retention-request.ts'
      - 'agent-node/src/runtime/opencode-copresence/v1-host-registry.ts'
      - 'agent-node/src/runtime/opencode-acp/binary.ts'
      - 'agent-node/src/runtime/opencode-backend.ts'
      - 'agent-node/src/runtime/opencode-versions.ts'
      - 'agent-node/src/shared/opencode-preset.ts'
      - 'tests/test1271-v1-safe-retention-request/**'
      - 'tests/test1194-v1-shared-feasibility/package-integrity.json'
      - '.github/workflows/v1-safe-retention-request.yml'
  workflow_dispatch:
permissions:
  contents: read
# #2136 —— 同一 PR 重新 push 时**取消上一轮还在排队的运行**。
# 2026-10-25 实测:一条 PR 反复 push 会留下 28 个过期 workflow 一直占着 runner 队列,
# 新提交反而排不上(当天三条 PR 全卡在 queued)。只在 pull_request 上取消:
# 主分支的 push 运行不取消 —— 那可能是发布/部署门。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  topology:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        version: ['1.18.1', '1.18.34']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build exact pinned default-wrapper fixture
        run: docker build --build-arg OPENCODE_VERSION=${{ matrix.version }} --build-arg SOURCE_COMMIT=${{ github.sha }} -f tests/test1271-v1-safe-retention-request/Dockerfile -t v1-safe-retention-request-test .
      - name: Observe and revalidate an actual default native allocation
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --init --network none -e EXPECTED_SOURCE_COMMIT=${{ github.sha }} v1-safe-retention-request-test 2>&1 | tee report-test1271-${{ matrix.version }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TEST-ONLY-v1-safe-retention-request-${{ matrix.version }}-${{ github.sha }}
          path: report-test1271-${{ matrix.version }}.txt
