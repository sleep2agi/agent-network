name: Supervisor identity core
on:
  pull_request:
    paths:
      - 'server/src/create-node.ts'
      - 'server/src/node-token-identity.ts'
      - 'server/src/host-supervisor-identity*'
      - 'server/src/tools.ts'
      - 'server/src/server.ts'
      - 'tests/test1109-supervisor-identity/**'
      - 'tests/test678-daemon-token-owner/mutations.ts'
      - 'docs/tests/report-test1109-supervisor-identity.txt'
      - 'docs/tests/release-v0.9.0-preview.137.md'
      - '.github/workflows/supervisor-identity-core.yml'
permissions:
  contents: read
jobs:
  supervisor-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -t supervisor-identity-test -f tests/test1109-supervisor-identity/Dockerfile .
      - run: docker run --rm --init --network none supervisor-identity-test
