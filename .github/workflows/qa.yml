# anet QA (v0) — report-only PR gate
#
# Runs `bash scripts/qa.sh` on PRs and pushes to main.
# Non-blocking: failures show as a red ✕ on the PR but do NOT prevent merge
# unless someone explicitly adds this check to branch protection. This is by
# design — see docs/qa/strategy.md §4 (CI gate first tier is "report-only").
#
# Tracked in https://github.com/sleep2agi/agent-network/issues/31 R8.

name: anet QA (v0)

on:
  pull_request:
    paths:
      - 'server/**'
      - 'docs/stale-issue-review.md'
      - 'scripts/check-doc-claims.py'
      - 'tests/test846-doc-claims/**'
      - 'agent-network/**'
      - 'agent-node/**'
      - 'tests/qa-*/**'
      - 'scripts/qa.sh'
      - 'docs/qa/**'
      - '.github/workflows/qa.yml'
      - 'tests/test725-agent-node-unit-ci/**'
      - 'tests/test745-agent-network-unit-ci/**'
      - 'tests/test746-setup-bun-pin/**'
      # A test directory belongs here exactly when CI executes it — otherwise
      # editing the test cannot re-run the gate that runs it. The four below are
      # reached through scripts/qa.sh L1_TESTS and the e2e workflow; the other
      # ~160 dirs under tests/ are not run by any workflow, so listing them
      # would only look like coverage.
      - 'tests/test292-e2e-hard-gate/**'
      - 'tests/test686-rest-shape-golden/**'
      - 'tests/test765-batch-runtime-gate/**'
      - 'tests/test766-bunx-preflight/**'
      # test823 是这道 L1 并发闸门自己的回归,跑的是真的 scripts/qa.sh
      # (把 docker/npm 换成 PATH 上的桩)。改它必须能重跑跑它的 workflow。
      - 'tests/test823-l1-concurrency-cap/**'
      - 'tests/test798-server-unit-ci/**'
      # test798 的镜像 COPY 了 test601 的 race-worker.ts,
      # 且 server/src/scheduled-tasks-http.test.ts 会执行它做「两个真 Hub 抢同一 occurrence」——
      # 只改那个 worker 的 PR 不该跳过这道门(codex P2,核过属实)
      - 'tests/test601-hub-scheduled-tasks/**'
      - 'tests/test224-grok-preview-security/**'
      - 'tests/test597-dashboard-slash-namespace/**'
      - 'tests/test679-task-trace/**'
      - 'tests/lib/**'
      - 'docs-site/**'
      - 'docs/doc-source-pins-baseline.txt'
      - 'scripts/check-doc-source-pins.py'
      - 'tests/test831-doc-source-pins/**'
      - 'tests/test813-grok-mcp-readiness/**'
      # 🔴 加这一条的直接原因:#1017 改了 test225 的夹具,27 个 check 全绿,
      #    而 CI 从头到尾没有执行过这个套件。job 存在、挂上、会被触发是三件事,
      #    漏的就是第三件。
      - 'tests/test225-grok-preview-package-live/**'
      - 'tests/test233-grok-main-integration/**'
      - 'tests/test234-grok-profile-disclosure/**'
      - 'tests/test235-grok-mcp-outbound-only/**'
      - 'tests/test219-grok-copresence/**'
      - 'tests/test605-grok-startup-model-label/**'
      - 'tests/test735-hub-daemon-rebuild/**'
      - 'deploy/hub/hub-daemon.sh'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'docs/stale-issue-review.md'
      - 'scripts/check-doc-claims.py'
      - 'tests/test846-doc-claims/**'
      - 'agent-network/**'
      - 'agent-node/**'
      - 'tests/qa-*/**'
      - 'scripts/qa.sh'
      - '.github/workflows/qa.yml'
      - 'tests/test725-agent-node-unit-ci/**'
      - 'tests/test745-agent-network-unit-ci/**'
      - 'tests/test746-setup-bun-pin/**'
      # A test directory belongs here exactly when CI executes it — otherwise
      # editing the test cannot re-run the gate that runs it. The four below are
      # reached through scripts/qa.sh L1_TESTS and the e2e workflow; the other
      # ~160 dirs under tests/ are not run by any workflow, so listing them
      # would only look like coverage.
      - 'tests/test292-e2e-hard-gate/**'
      - 'tests/test686-rest-shape-golden/**'
      - 'tests/test765-batch-runtime-gate/**'
      - 'tests/test766-bunx-preflight/**'
      # test823 是这道 L1 并发闸门自己的回归,跑的是真的 scripts/qa.sh
      # (把 docker/npm 换成 PATH 上的桩)。改它必须能重跑跑它的 workflow。
      - 'tests/test823-l1-concurrency-cap/**'
      - 'tests/test798-server-unit-ci/**'
      # test798 的镜像 COPY 了 test601 的 race-worker.ts,
      # 且 server/src/scheduled-tasks-http.test.ts 会执行它做「两个真 Hub 抢同一 occurrence」——
      # 只改那个 worker 的 PR 不该跳过这道门(codex P2,核过属实)
      - 'tests/test601-hub-scheduled-tasks/**'
      - 'tests/test224-grok-preview-security/**'
      - 'tests/test597-dashboard-slash-namespace/**'
      - 'tests/test679-task-trace/**'
      - 'tests/lib/**'
      - 'docs-site/**'
      - 'docs/doc-source-pins-baseline.txt'
      - 'scripts/check-doc-source-pins.py'
      - 'tests/test831-doc-source-pins/**'
      - 'tests/test813-grok-mcp-readiness/**'
      # 🔴 加这一条的直接原因:#1017 改了 test225 的夹具,27 个 check 全绿,
      #    而 CI 从头到尾没有执行过这个套件。job 存在、挂上、会被触发是三件事,
      #    漏的就是第三件。
      - 'tests/test225-grok-preview-package-live/**'
      - 'tests/test233-grok-main-integration/**'
      - 'tests/test234-grok-profile-disclosure/**'
      - 'tests/test235-grok-mcp-outbound-only/**'
      - 'tests/test219-grok-copresence/**'
      - 'tests/test605-grok-startup-model-label/**'
      - 'tests/test735-hub-daemon-rebuild/**'
      - 'deploy/hub/hub-daemon.sh'

# Older runs on the same ref get cancelled — saves minutes when a PR is
# updated rapidly. main pushes run independently.
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  doc-claims:
    name: doc claim freshness (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # 🔴 这道门只证明 docs/stale-issue-review.md 里引的行号还没漂。
      #    正文的结论对不对、引用之外的散文,它都不检查。
      #    见 #846 与 scripts/check-doc-claims.py 的文件头。
      - name: Build test846-doc-claims
        run: |
          docker build \
            --build-arg TEST846_SOURCE_COMMIT="$GITHUB_SHA" \
            --build-arg TEST846_RUNSH_BLOB="$(git rev-parse "HEAD:tests/test846-doc-claims/run.sh")" \
            -t anet-test846-doc-claims \
            -f tests/test846-doc-claims/Dockerfile .

      - name: Run test846-doc-claims
        run: docker run --rm --network none anet-test846-doc-claims

  agent-network-unit:
    name: agent-network unit (Docker, non-root)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Build exact agent-network unit image
        run: |
          docker build \
            --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            -t anet-test745-agent-network-unit \
            -f tests/test745-agent-network-unit-ci/Dockerfile .

      - name: Run complete agent-network unit domain
        run: docker run --rm anet-test745-agent-network-unit

  server-unit:
    name: server unit (Docker, non-root)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Build exact server unit image
        run: |
          docker build \
            --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            --build-arg RUNSH_BLOB="$(git rev-parse HEAD:tests/test798-server-unit-ci/run.sh)" \
            -t anet-test798-server-unit \
            -f tests/test798-server-unit-ci/Dockerfile .

      - name: Run complete server unit domain
        run: docker run --rm anet-test798-server-unit

  agent-node-unit:
    name: agent-node unit (Docker, non-root)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Build exact agent-node unit image
        run: |
          docker build \
            --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            -t anet-test725-agent-node-unit \
            -f tests/test725-agent-node-unit-ci/Dockerfile .

      - name: Run complete agent-node unit domain
        run: docker run --rm anet-test725-agent-node-unit

  recovered-suites:
    name: recovered suites (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # 🔴 顺序不是随意的。CLAUDE.md 的测试规则写明:
      #    「分层测试,从简单到复杂:环境→认证→单点通信→完整流程→多用户→安全」
      #    「前一层不过就不跑后面的」
      #    所以安全套件(test224)放在最后 —— 底层套件先红时,不该已经产出
      #    一份安全证据,因为那份证据的前提根本没成立。
      #    第一版我把 test224 放在最前,正好把这条规则倒过来了。

      - name: Build test597-dashboard-slash-namespace
        run: |
          docker build \
            --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            -t anet-test597-dashboard-slash-namespace \
            -f tests/test597-dashboard-slash-namespace/Dockerfile .

      - name: Run test597-dashboard-slash-namespace
        run: |
          set -o pipefail   # 🔴 不加它,tee 的 0 会盖掉套件的非零退出
          mkdir -p "$RUNNER_TEMP/suite-artifacts"
          docker run --rm anet-test597-dashboard-slash-namespace \
            2>&1 | tee "$RUNNER_TEMP/suite-artifacts/test597.log"

      - name: Build test679-task-trace
        run: |
          docker build \
            --build-arg TEST679_SOURCE_COMMIT="$GITHUB_SHA" \
            -t anet-test679-task-trace \
            -f tests/test679-task-trace/Dockerfile .

      - name: Run test679-task-trace
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/suite-artifacts"
          docker run --rm anet-test679-task-trace \
            2>&1 | tee "$RUNNER_TEMP/suite-artifacts/test679.log"

      - name: Build test224-grok-preview-security
        run: |
          docker build \
            --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            -t anet-test224-grok-preview-security \
            -f tests/test224-grok-preview-security/Dockerfile .

      - name: Run test224-grok-preview-security
        # 🔴 --network none 不是可选项:tests/test224-.../Dockerfile 第 13 行明写
        # 「the actual gate is run with --network none」,而 run.sh 会打印
        # 「runtime executed with network disabled」。不带这个 flag,那句话就是假的 ——
        # 实测两种跑法都 PASS 且都打印同一句,套件自己不会拦住这个错误。
        #
        # /artifacts 挂出来:该套件把 report-test224.txt 写在容器内 /artifacts 下,
        # 而 --rm 会把那个文件系统删掉 —— 跑完什么都不留,门每次都真跑却无证据可查。
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/suite-artifacts"
          docker run --rm --network none \
            -v "$RUNNER_TEMP/suite-artifacts:/artifacts" \
            anet-test224-grok-preview-security \
            2>&1 | tee "$RUNNER_TEMP/suite-artifacts/test224.log"

      # 三个 suite 都是 root 容器写进 bind mount 的,产物属主 root、mode 0600。
      # upload-artifact 以 runner 用户打包 → EACCES: permission denied,
      # 于是「门全绿但 job 判红」,而且证据也归档不了。实测报错:
      #   Error: EACCES: permission denied, open '.../suite-artifacts/report-test224.txt'
      # if: always() —— 前面步骤红时更需要把证据传出来。
      - name: Normalize recovered-suite artifact permissions
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/suite-artifacts"
          chmod -R u+rw "$RUNNER_TEMP/suite-artifacts"

      - name: Upload recovered-suite artifacts
        # if: always() —— 套件红了才最需要看它的输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-suite-artifacts
          path: ${{ runner.temp }}/suite-artifacts
          if-no-files-found: warn

  qa:
    name: L0 + L1 (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Show QA test inventory
        run: bash scripts/qa.sh --list

      - name: Run L0 (bun test, ms-budget)
        run: bash scripts/qa.sh --l0

      - name: Run L1 (Docker contract tests, ~16s parallel)
        run: bash scripts/qa.sh --l1

      - name: Dump test logs on failure
        if: failure()
        run: |
          set +e
          for f in /tmp/qa-*.log; do
            echo "================ $f ================"
            tail -60 "$f"
          done

  doc-source-pins:
    name: doc source-pin floor (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # 🔴 这道门守的是下限,不是正确性:它只保证「已知失效的行号 pin 不再变多」。
      #    实测召回率 5/10 —— 抓不到「锚点指着一行正常代码、只是不是它声称的那
      #    一行」。见 #831 与 scripts/check-doc-source-pins.py 的文件头。
      #    别拿这个 job 的绿色去论证 #831 已解决。

      # 🔴 下面这一步补的正是上面那句「抓不到」的一小块(#852):锚文本里**点了名的
      #    符号**,必须真的在钉住的那一行附近。2026-08-18 首次对 main 跑,抓到 4 处 ——
      #    四处钉住的行分别是 `}`、`text: JSON.stringify({`、`model = COALESCE(...)`、
      #    `if (!configFilePath || !threadId) return;`,**全都长得像正常代码**,所以
      #    读者点进去连怀疑都不会产生。四处已在同一个 PR 里改对,这一步因此起点是绿的。
      #    它同时打印**跳过了多少** —— 一个只说「0 处漂移」不说「跳过 10 处」的门,
      #    读起来像「全都查过了」。
      # 🔴 这一步已搬到 .github/workflows/doc-symbol-pins.yml（无 paths 过滤）。
      #    留在这里跑不到该跑的时候：qa.yml 的 paths 里没有 docs/architecture.md，
      #    而那正是行号漂得最多的文件（#1001 一次抓到三处）。
      # test813 —— #825 加的 Grok CommHub MCP 就绪门。接进来的理由很直接：
      # 那条 PR 的目的是「MCP 没就绪时 fail closed」，而验证这件事的套件
      # 如果不进 CI，fail-closed 这个保证就没有任何东西持续守着它。
      # Dockerfile 的 build-arg 名是 SOURCE_COMMIT（不是 831 的 TEST831_SOURCE_COMMIT），
      # 容器里由 ENV TEST813_SOURCE_COMMIT 承接 —— 照抄 831 的参数名会静默拿不到值。
      - name: Build test813-grok-mcp-readiness
        run: |
          docker build \
            --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            -t anet-test813-grok-mcp-readiness \
            -f tests/test813-grok-mcp-readiness/Dockerfile .

      - name: Run test813-grok-mcp-readiness
        run: docker run --rm --network none anet-test813-grok-mcp-readiness

      - name: Build test831-doc-source-pins
        run: |
          docker build \
            --build-arg TEST831_SOURCE_COMMIT="$GITHUB_SHA" \
            --build-arg TEST831_RUNSH_BLOB="$(git rev-parse "HEAD:tests/test831-doc-source-pins/run.sh")" \
            -t anet-test831-doc-source-pins \
            -f tests/test831-doc-source-pins/Dockerfile .

      - name: Run test831-doc-source-pins
        run: docker run --rm --network none anet-test831-doc-source-pins

  test225-known-failures:
    name: test225 known-failure ratchet (Docker)
    runs-on: ubuntu-latest
    # 完整跑一次 ~8 分钟(装依赖 + 起容器内 Hub + 真 tmux attach)。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史才能 git archive 出一个不可变上下文。
          fetch-depth: 0

      # 🔴 test225 **不能**用 `docker build ... .` 那种可变检出上下文 ——
      #    它自己第一件事就是拦下来:
      #        FAIL: test225 build context must come from git archive, not a mutable checkout
      #    因为 source-commit.txt 里是 `$Format:%H$`,只有 git archive 会替换它。
      #    照抄别的 job 的写法会在这里立刻红,而且红得让人以为是套件坏了。
      - name: Build test225 from an immutable git-archive context
        run: |
          set -euo pipefail
          CTX=$(mktemp -d)
          git archive "$GITHUB_SHA" | tar -x -C "$CTX"
          test "$(cat "$CTX/tests/test225-grok-preview-package-live/source-commit.txt")" = "$GITHUB_SHA" \
            || { echo "::error::git archive 没有替换 source-commit.txt —— export-subst 没生效"; exit 1; }
          docker build \
            --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            -t anet-test225-grok-preview \
            -f "$CTX/tests/test225-grok-preview-package-live/Dockerfile" "$CTX"

      # 这一步**预期非 0** —— test225 现在有 2 条已知失败(#1020 / #1021)。
      # 判定不在这里,在下一步的棘轮。所以这里必须容错,
      # 但报告必须真的产出来,否则下一步会因为「报告不存在」而红(那是对的)。
      # 🔴 产物目录这一步踩了两个坑,都写在这里,别再照抄回去:
      #
      #    ① 把宿主目录挂进 /artifacts —— 容器是 `USER node`(uid 1000),
      #       而 runner 上 $RUNNER_TEMP 属主是 uid 1001,挂进去写不了,套件报
      #           FAIL: could not atomically create a private report
      #       并且**一个报告都不产出**,棘轮只能看到「报告不存在」。
      #       我本地跑这一版是绿的,纯粹因为宿主 uid 恰好也是 1000 ——
      #       绿依赖了一个偶然的 uid 巧合,换台机器就红。
      #
      #    ② 干脆不挂卷 —— 也不行,只是换个错法:node 用户在 `/` 下建不了目录
      #           mkdir: cannot create directory '/artifacts': Permission denied
      #
      #    所以把 ARTIFACT_DIR 指到容器内 node 自己的目录,再 cp 出来。
      #    /test225-work 在 Dockerfile 里 chown 给了 node,而且不触碰 run.sh 的守卫
      #    (禁止 $HOME / $WORK 子树、/tmp/test225-*、/ 及其祖先 —— 都不沾)。
      - name: Run test225 (预期红;判定交给棘轮)
        run: |
          set -uo pipefail
          docker run --name test225-run -e ARTIFACT_DIR=/test225-work/artifacts \
            anet-test225-grok-preview \
            || echo "  (套件退出码非 0 —— 这一步不判定,继续)"
          mkdir -p "$RUNNER_TEMP/art225"
          docker cp test225-run:/test225-work/artifacts/. "$RUNNER_TEMP/art225/" \
            || echo "::warning::无法从容器取出产物 —— 下一步会因报告不存在而红,那是对的"
          docker rm -f test225-run >/dev/null 2>&1 || true
          ls -la "$RUNNER_TEMP/art225/" || true

      # 🔴 判据在这里,不在上一步。
      #    比的是 FAIL 的**集合**不是个数:实测里有一组 FAIL 个数同样是 2、
      #    内容却完全不同({auth evidence, attach socket} vs {auth evidence, Feishu}),
      #    只比个数会得出「没差别」。
      #    另外有一条 PASS 地板,防的是「构建成功但立刻崩掉」——
      #    那种运行产出 0 个 FAIL,而 0 个 FAIL 在只比 FAIL 的判据下是最漂亮的绿。
      - name: 棘轮 —— FAIL 集合必须等于已知基线
        run: |
          python3 tests/test225-grok-preview-package-live/check-known-failures.py \
            "$RUNNER_TEMP/art225/report-test225.txt" \
            tests/test225-grok-preview-package-live/known-failures.txt

      - name: 保留报告(失败时最有用的那份)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test225-report
          path: ${{ runner.temp }}/art225/
          if-no-files-found: warn

  grok-green-suites:
    name: grok suites (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 🔴 这两个套件是**直接做阻塞门**,不套 known-failure 棘轮。
      #    棘轮是给「已经红、但必须先接进来才知道它是真绿还是假绿」的情况用的
      #    (test225 那种)。这两个我先跑了基线,是真绿:
      #        test233  Summary: PASS (Docker-only integration regression)
      #        test234  Summary: PASS (4 unit tests; CLI build; runbook/wiring gates; mutation red)
      #    对真绿的套件套棘轮只会让它以后变红时**不红**,那是反的。
      #
      #    接它们的理由和 test225 同一条:对着 origin/main 数,12 个 grok 套件里
      #    此前只有 3 个在 CI 里。一个长期不跑的套件,真绿和假绿输出逐字相同。
      #
      #    `--network none` 是**实测过**的,不是照抄别处:两个套件在运行期都不需要网络
      #    (test233 只在 docker build 阶段要)。`-e ARTIFACT_DIR=/tmp/art` 同样是
      #    我跑基线时用的那条命令 —— 不写未验证过的变体。
      - name: Build + run test233-grok-main-integration
        run: |
          docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            -t anet-test233-grok-main-integration \
            -f tests/test233-grok-main-integration/Dockerfile .
          docker run --rm --network none -e ARTIFACT_DIR=/tmp/art \
            anet-test233-grok-main-integration

      - name: Build + run test234-grok-profile-disclosure
        run: |
          docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            -t anet-test234-grok-profile-disclosure \
            -f tests/test234-grok-profile-disclosure/Dockerfile .
          docker run --rm --network none -e ARTIFACT_DIR=/tmp/art \
            anet-test234-grok-profile-disclosure

      # 这个套件此前基线是**红**的，红在相对 import 够不着 agent-network
      # （容器把它拷到 /test235，而 `../../` 从那里解析成 `/`）。
      # 本 PR 把容器布局改成与仓库同构之后它是真绿的：
      #   Summary: PASS (real MCP child; zero long-lived Hub sockets; 40/40 outer ownership; 12 outbound calls; mutation red)
      # 自带一条见证红：PASS: witnessed-red outbound-only mutation rc=1
      # `--network none` 同样是**实测过**的那条命令。
      - name: Build + run test235-grok-mcp-outbound-only
        run: |
          docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            -t anet-test235-grok-mcp-outbound-only \
            -f tests/test235-grok-mcp-outbound-only/Dockerfile .
          docker run --rm --network none -e ARTIFACT_DIR=/tmp/art \
            anet-test235-grok-mcp-outbound-only

      # 🔴 这个套件是本批里最重的一格 —— 它一次跑 **311 个测试**：
      #     Summary: PASS (311 tests, 0 failures; all validation ran inside Docker)
      #     PASS: FIFO/human arbitration + final reply + approval + reconnect + single bridge + liveness
      #   覆盖的是共存运行时的核心行为(FIFO 仲裁 / 最终回复 / 审批 / 重连 / 单桥 / 存活判定)，
      #   而对着 origin/main 数，它的 CI 引用数是 **0** —— 一次都没跑过。
      #   这不是「有些测试没跑」，是「共存核心行为的 311 条断言没跑」。
      #
      #   直接做阻塞门，不套 known-failure 棘轮：基线跑过，它是**真绿**的。
      #   `--network none -e ARTIFACT_DIR=/tmp/art` 是那次基线用的**同一条命令**，
      #   不往 workflow 里写没验证过的变体。
      - name: Build + run test219-grok-copresence
        run: |
          docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            -t anet-test219-grok-copresence \
            -f tests/test219-grok-copresence/Dockerfile .
          docker run --rm --network none -e ARTIFACT_DIR=/tmp/art \
            anet-test219-grok-copresence

      # 基线：Ran 1 test across 1 file. RESULT: PASS —— 真绿，直接做阻塞门。
      # 命令是基线用的那一条原样（--network none -e ARTIFACT_DIR=/tmp/art）。
      - name: Build + run test605-grok-startup-model-label
        run: |
          docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            -t anet-test605-grok-startup-model-label \
            -f tests/test605-grok-startup-model-label/Dockerfile .
          docker run --rm --network none -e ARTIFACT_DIR=/tmp/art \
            anet-test605-grok-startup-model-label

  hub-daemon-gate:
    # 🔴 单独一个 job，不塞进 grok-green-suites —— 那个名字会对它包含的内容说谎。
    #    （改已有 job 的名字会动分支保护里的 required check，风险更高，所以新开。）
    name: hub daemon fail-closed (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 这一格守的是**全军团单点**：`deploy/hub/hub-daemon.sh` 是生产 CommHub 的启动脚本
      # （pm2 守着；脚本自己的头里记着 2026-07-29 那次误杀导致 95 个 agent 掉线）。
      # test735 覆盖的正是它的 fail-closed 约束：
      #   assert_missing_secret_rejected   缺 vault 密钥必须拒绝启动
      #   assert_occupied_port_rejected    端口已被监听必须拒绝（防第二个 hub 抢同一个 DB）
      #   assert_missing_ss_rejected       看不见端口就拒绝启动
      #   assert_missing_runtime_rejected / assert_missing_bun_rejected / assert_success_path
      #
      # 对着 origin/main 数，它此前的 CI 引用是 **0** —— 这份测试从没在 CI 上跑过。
      #
      # 基线（Docker、--network none，不碰生产 hub）：
      #   L1 HUB_DAEMON_REBUILD_PASS
      #   MUTATION_RED vault-gate-removed      ← 自带见证红：去掉 vault 闸门它会红
      #   RESULT: PASS
      # 真绿 + 自带变异，所以直接做阻塞门，不套 known-failure 棘轮。
      #
      # `--network none -e ARTIFACT_DIR=/tmp/art` 是跑基线时用的**同一条命令**。
      - name: Build + run test735-hub-daemon-rebuild
        run: |
          docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            -t anet-test735-hub-daemon-rebuild \
            -f tests/test735-hub-daemon-rebuild/Dockerfile .
          docker run --rm --network none -e ARTIFACT_DIR=/tmp/art \
            anet-test735-hub-daemon-rebuild
