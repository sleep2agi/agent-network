# Standalone single-file `anet` (bun build --compile).
#
# This does not publish npm packages. release.yml is unchanged.
# `publish` defaults to false. A GitHub release `cli-bin-v<version>` is
# created only for workflow_dispatch with publish=true after every matrix
# leg is green.
#
# Phase 1 targets: linux-x64, darwin-arm64.
# TODO: linux-arm64, darwin-x64, windows-x64 (no Authenticode certificate yet).
# TODO(signing): macOS Developer ID + notarization, then Windows Authenticode.
# Unsigned darwin binaries are for the CI runner only. Shipping one to users
# waits on notarization. This workflow does not clear Gatekeeper quarantine.

name: standalone anet binary

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full 40-character main commit SHA (required when publish=true)'
        required: false
        type: string
      version:
        description: 'Bundle version stamped into the binary and the release tag cli-bin-v<version>'
        required: true
        type: string
      publish:
        description: 'Upload SHA256SUMS + anet-bin-manifest.json to GitHub release cli-bin-v<version>'
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/cli-binary.yml'
      - '.github/scripts/smoke-anet-bin.sh'
      - '.github/scripts/assemble-anet-bin-manifest.py'
      - 'scripts/build-anet-bin.mjs'
      - 'agent-network/bin/anet-bin.ts'
      - 'agent-network/bin/cli.ts'
      - 'agent-network/src/standalone-bin.ts'
      - 'agent-network/src/standalone-build-stamp.ts'
      - 'agent-node/src/cli.ts'
      - 'server/bin/commhub.ts'
      - 'server/src/server.ts'

permissions:
  contents: read

concurrency:
  group: cli-binary-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: compile ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: bun-linux-x64
            artifact: anet-linux-x64
          - os: macos-14
            target: bun-darwin-arm64
            artifact: anet-darwin-arm64
          # TODO(linux-arm64): os ubuntu-24.04-arm, target bun-linux-arm64, artifact anet-linux-arm64
          # TODO(darwin-x64): os macos-13, target bun-darwin-x64, artifact anet-darwin-x64
          # TODO(windows-x64): os windows-2022, target bun-windows-x64, artifact anet-windows-x64.exe
          #   No Authenticode certificate yet. Leave this leg commented until signing exists.
    env:
      BUNDLE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.0.0-pr' }}
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}
      RELEASE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && '0' || '1' }}

      - name: Require an ancestor of main when publishing
        run: |
          if [[ "$PUBLISH" == true ]]; then
            bash .github/scripts/verify-release-main.sh
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install package dependencies
        run: |
          bun install --frozen-lockfile --cwd agent-network
          bun install --frozen-lockfile --cwd agent-node
          bun install --frozen-lockfile --cwd server

      # TODO(signing): before upload, sign the darwin binary with a Developer ID
      # Application certificate and notarize it. Secrets this phase does not have:
      #   APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD, APPLE_TEAM_ID,
      #   APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_KEY (App Store Connect API),
      #   or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD.
      # An unsigned macOS binary is quarantined by Gatekeeper after download.
      # Do not document `xattr -d com.apple.quarantine` as the install path.
      # TODO(signing): Windows Authenticode. No certificate exists yet.

      - name: Compile standalone anet
        run: |
          node scripts/build-anet-bin.mjs \
            --target "${{ matrix.target }}" \
            --outfile "dist/${{ matrix.artifact }}" \
            --bundle-version "$BUNDLE_VERSION"

      - name: Smoke and size gate
        run: bash .github/scripts/smoke-anet-bin.sh "dist/${{ matrix.artifact }}" "dist/${{ matrix.artifact }}.build.json"

      - name: SHA256
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ matrix.artifact }}*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
            dist/${{ matrix.artifact }}.build.json
          if-no-files-found: error

  publish:
    name: publish cli-bin release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Require the release commit to be on main
        env:
          PUBLISH: "true"
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: bash .github/scripts/verify-release-main.sh

      - uses: actions/download-artifact@v4
        with:
          pattern: anet-*
          path: artifacts

      - name: Assemble manifest
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          python3 .github/scripts/assemble-anet-bin-manifest.py \
            --artifacts artifacts \
            --version "$VERSION" \
            --commit "$RELEASE_COMMIT" \
            --out release

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          tag="cli-bin-v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists"
            exit 1
          fi
          gh release create "$tag" \
            --target "$RELEASE_COMMIT" \
            --title "anet binary ${tag}" \
            --notes "Standalone anet executable ${VERSION} built from ${RELEASE_COMMIT}. Not an npm publish. macOS binaries in this phase are unsigned; do not distribute them until notarized. Windows is not included." \
            release/anet-* \
            release/SHA256SUMS \
            release/anet-bin-manifest.json
