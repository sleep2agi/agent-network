# Auto-deploy docs-site → anet.sh on merge to main.
#
# 🔴 anet.sh 一直不接 git 自动部署:合并进 main 不会更新站点,要有人手动
#    预构建部署(见 deploy/docs-site/README.md)。这个空档反复触发
#    published-artifact-drift 的 docs-site-drift 红(#1421 一类),并且是纯重复劳动
#    (一个 session 里手动重部署过 3 次)。本 workflow 把那步自动化。
#
# 前置(仓库 Settings → Secrets and variables → Actions,一次性):
#   - VERCEL_TOKEN        Vercel 部署令牌(唯一真·密钥)—— ⚠️ 2026-08-30 仍待 owner 配
#   - VERCEL_ORG_ID       ✅ 已配(非密钥,值见 deploy/docs-site/vercel-project.json)
#   - VERCEL_PROJECT_ID   ✅ 已配(同上)
# 未设 VERCEL_TOKEN 时本 workflow **优雅跳过**(打 warning、不判红),设好即生效。
# 🔴 跳过期间不会造成盲区:站点落后仍由 docs-site-drift 每日发现并开 tracker issue。
name: deploy-anet-sh

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/deploy-anet-sh.yml'
  workflow_dispatch:

concurrency:
  group: deploy-anet-sh
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — skip cleanly if VERCEL_TOKEN is not configured
        id: guard
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not set — skipping anet.sh deploy. Add VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID in repo secrets to enable."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip == 'false'
        with:
          node-version: '24'

      - name: Deploy to production (build fails closed on dead links)
        if: steps.guard.outputs.skip == 'false'
        working-directory: docs-site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npm ci
          # vercel build 用 vitepress;ignoreDeadLinks 未设 ⇒ 有死链 build 失败,
          # 死链不会被推上线(与手动流程一致)。
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          # 🔴 退出码不穿管道:先落盘再看,否则 $? 抓的是 tee/grep 的。
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" > deploy.log 2>&1 || rc=$?
          cat deploy.log
          [ "${rc:-0}" -eq 0 ] || { echo "::error::部署失败(rc=$rc)"; exit "$rc"; }
          # 🔴 #1163 是一条成本红线:绝不让 Vercel 远端构建(远端构建费用曾达 100 美元/月)。
          #    这一行是它的放行判据 —— **做成断言,不是打印给人看**。
          #    实测 2026-08-30:照旧 README 手工部署 4 次,4 次全走远端构建、0 次 prebuilt,
          #    而每次日志都在眼前。「靠人看日志」在这件事上是 0/4。
          grep -Fq 'Using prebuilt build artifacts' deploy.log || {
            echo "::error::日志里没有 'Using prebuilt build artifacts' —— 这次很可能走了远端构建(#1163 成本红线)。"
            echo "::error::检查 deploy 是否仍带 --prebuilt、以及 vercel build 是否真的产出了 .vercel/output。"
            exit 1
          }
          echo "✅ deployed docs-site → anet.sh (prebuilt confirmed)"

      # 🔴 「部署成功」不等于「内容上线了」。上面那条 prebuilt 断言证明的是
      #    **没有走远端构建**(成本红线),它对「这次改的那句话到底在不在线上」
      #    一个字都没说。2026-08-30 手工部署时实测过两种假象:
      #      · 部署确实成功,drift 门却报「落后」——(a) 在带未提交改动的检出上跑门,
      #        (b) 指纹选中了代码围栏里的行、被语法高亮拆成多个 span 永远匹配不上(#1552 已修);
      #      · 反过来,`deploy rc=0` 也从不保证被改的页面真的换了内容。
      #    ⇒ 唯一能回答这个问题的是**按内容比对**,所以在这里跑 drift 门。
      #
      #    先 continue-on-error(只报不拦):这一步依赖 CDN 传播,新加的判据在证明自己
      #    稳定之前不该拦住一次**已经完成**的部署。稳定几天后再去掉 continue-on-error。
      - name: verify by content (report-only)
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        run: |
          set -uo pipefail
          # CDN 传播:重试而不是一次定生死。间隔递增,总计约 45s。
          for wait in 5 10 30; do
            sleep "$wait"
            out=$(python3 .github/scripts/check-docs-site-drift.py 2>&1) && rc=0 || rc=$?
            printf '%s\n' "$out"
            [ "$rc" -eq 0 ] && { echo "✅ live site matches main"; exit 0; }
            echo "— 第 ${wait}s 这轮未通过,可能仍在 CDN 传播,重试…"
          done
          echo "::warning::部署已完成,但内容比对在约 45s 内没有通过。"
          echo "::warning::这一步目前只报不拦。请人工确认:改动是否真的出现在 https://anet.sh 上。"
          exit 1
