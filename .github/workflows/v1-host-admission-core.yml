name: V1 host admission core
on:
  pull_request:
    paths:
      - 'agent-node/src/runtime/opencode-copresence/v1-host-registry.ts'
      - 'agent-node/src/runtime/opencode-copresence/v1-shared-read.ts'
      - 'agent-node/src/runtime/opencode-acp/binary.ts'
      - 'agent-node/src/runtime/opencode-versions.ts'
      - 'deploy/node/opencode-v1-host/**'
      - 'tests/test1208-v1-host-admission/**'
      - 'tests/test1194-v1-shared-feasibility/package-integrity.json'
      - '.github/workflows/v1-host-admission-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        version: ['1.18.1', '1.18.34']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build exact pinned native fixture
        run: docker build --build-arg OPENCODE_VERSION=${{ matrix.version }} --build-arg SOURCE_COMMIT=${{ github.sha }} -f tests/test1208-v1-host-admission/Dockerfile -t v1-host-admission-test .
      - name: Private filesystem refusal, executable attestation and registry-to-native read
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --init --network none -e EXPECTED_SOURCE_COMMIT=${{ github.sha }} v1-host-admission-test 2>&1 | tee report-test1208-${{ matrix.version }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TEST-ONLY-v1-host-admission-${{ matrix.version }}-${{ github.sha }}
          path: report-test1208-${{ matrix.version }}.txt
