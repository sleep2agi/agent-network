name: desktop-fallback-sync

# Rebuild the static updater fallback from a published desktop release and open a
# PR. Manual on purpose: it runs once after a release, not on a timer that would
# keep opening PRs while nobody merges them.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 0.2.294). Empty = the latest published release.
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild the fallback from the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: node docs-site/scripts/sync-desktop-fallback.mjs "$VERSION"
      - name: Route check
        run: node docs-site/scripts/check-desktop-update-route.mjs
      - name: Open a PR when the file changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs-site/docs/public/desktop/update/fallback.json; then
            echo "nothing to change"; exit 0
          fi
          version=$(node -p "require('./docs-site/docs/public/desktop/update/fallback.json').version")
          branch="ci/desktop-fallback-$(echo "$version" | tr . -)"
          # #2346 —— 分支是否已经推过，用来区分「新版本第一次」和「同一版本的重试」。
          branch_existed=0
          if git ls-remote --exit-code --heads \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch" >/dev/null 2>&1; then
            branch_existed=1
          fi
          git config user.name "anet-fallback-bot"
          git config user.email "anet-fallback-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs-site/docs/public/desktop/update/fallback.json
          git commit -m "fix(site): desktop update fallback follows $version"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          # 失败要喊出来:0.2.295 那次 `gh pr create` 静默失败,只推了分支,PR 得人工补开。
          if ! out=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "fix(site): desktop update fallback follows $version" \
              --body "Generated by \`desktop-fallback-sync\` from the published $version release." 2>&1); then
            echo "$out"
            if [ -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --json number --jq '.[0].number // ""')" ]; then
              echo "a PR for $branch already exists — nothing more to do"
              exit 0
            fi
            # #2346 / #4427 —— 组织策略禁止 Actions 创建 PR（GraphQL createPullRequest 被拒）。
            # 这是**环境限制**，不是代码或数据故障：
            #   · 业务步骤（重建 fallback + route check）在上面已经全绿；
            #   · 分支一定已经推上去了，缺的只是「有人开 PR」这一个动作。
            # 所以**一律降级为 warning**，并把「人该做什么」写清楚 —— 2026-11-10 实测（0.2.498）：
            # 首次尝试直接 `::error::`，读的人会以为是重建失败，跑去改脚本。
            # 只有**不是这条策略**的失败才判红（那才是真的需要看的东西）。
            if printf '%s' "$out" | grep -qi 'not permitted to create or approve pull requests'; then
              echo "::warning::组织策略禁止 Actions 开 PR。fallback 已重建并通过 route check，分支 $branch 已推送；"
              echo "::warning::需要人工开并合并 PR： https://github.com/${GITHUB_REPOSITORY}/pull/new/$branch"
              echo "（这不是故障：内容已生成，只差一个人点「Create pull request」。见 #4427。）"
              exit 0
            fi
            echo "::error::gh pr create failed and no PR exists for $branch (first attempt for $version) — 失败原因不是组织策略，需要人看日志"
            exit 1
          fi
          echo "$out"
