# Run the two verifiers that already existed and that nothing called.
#
# scripts/verify-published-pins.sh and scripts/verify-release-tag.sh were both
# committed, both executable, both documented with the incident that motivated
# them — and `grep -rl` across .github/ and scripts/ found ZERO callers. A guard
# that is never invoked protects nothing, and its presence in the tree reads as
# if the risk were covered.
#
# Running verify-published-pins.sh by hand on 2026-08-17, for the first time,
# reported a live drift on its first invocation:
#
#   ❌ OPENCODE_AGENT_NODE_VERSION 期望 2.5.0-preview.31,
#      产物里是: 2.5.0-preview.28
#   1 个 pin 与已发布产物不一致 —— main 修了但用户装到的包没修
#
# That is the exact distinction the script's own header says bit this repo three
# times in one day, and it had been sitting undetected in the published preview.
#
# Why scheduled rather than per-PR: it inspects the PUBLISHED artifact, which a
# PR does not change, and it needs the npm registry. Running it on every PR
# would add a network dependency to every merge while telling us nothing new
# about the PR. Once a day plus manual dispatch matches what it measures.
#
# 🔴 Exit codes are mapped deliberately, because "could not measure" and
#    "measured and it is fine" must not collapse into the same green:
#      0 → pass
#      1 → fail (real drift)
#      2 → fail-soft with a loud notice (registry unreachable — NOT evidence of
#          agreement; the run reports that it could not measure)
#      3 → fail (zero pins compared — the script went blind)

name: published artifact drift

on:
  schedule:
    # 03:17 UTC. Off the hour and off :00/:30 so this repo does not pile onto
    # the same minute as every other scheduled job on the runners.
    - cron: '17 3 * * *'
  workflow_dispatch:
    # release-tag 需要三个参数（它校验的是「tag 剥出的 commit == 打包用的 commit」，
    # 而"打包用的 commit"只有发版的人知道，定时跑推不出来）。留空则跳过该 job。
    inputs:
      release_repo:
        description: 'release-tag: owner/name（留空则跳过 release-tag 这个 job）'
        required: false
        default: ''
      release_tag:
        description: 'release-tag: tag 名，例如 v1.2.3'
        required: false
        default: ''
      build_sha:
        description: 'release-tag: 打包用的完整 commit SHA'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/scripts/check-docs-site-drift.py'
      - 'scripts/verify-published-pins.sh'
      - 'scripts/verify-release-tag.sh'
      # 🔴 下面两个脚本的**唯一**调用方就是本 workflow，而它们原先不在 paths 里 ——
      #    改了它们、合进 main，那次 push 不会跑本 workflow，最长空窗到次日 03:17 UTC 的定时跑。
      #    (另外两个曾被怀疑漏掉的其实有第二入口:check-docs-site-drift.py 已在上面列出;
      #     check-doc-version-claims.py 由 docs-site-build.yml 在**每个 PR** 上跑。)
      - '.github/scripts/check-published-build-paths.py'
      - '.github/scripts/docs-site-drift-notify.sh'
      - '.github/workflows/published-artifact-drift.yml'

jobs:
  published-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify published pins match source
        run: |
          set +e
          bash scripts/verify-published-pins.sh preview
          rc=$?
          set -e
          case "$rc" in
            0) echo "pins agree with the published preview artifact." ;;
            2) echo "::warning::could not fetch the published artifact (rc=2). This run"\
                    "did NOT verify anything — treat it as unknown, not as agreement." ; exit 1 ;;
            3) echo "::error::the verifier compared ZERO pins (rc=3) — it went blind." ; exit 1 ;;
            *) echo "::error::published artifact drifted from source (rc=$rc)." ; exit 1 ;;
          esac

  release-tag:
    # 🔴 两处此前都是错的，而且互相遮掩：
    #
    #   (1) 原注释说「when a tag is what triggered us, or on demand」——
    #       但这个 workflow 的 push 触发只写了 `branches: [main]`，**没有 tags**。
    #       那半个说法从来不成立。
    #   (2) 原来那行是 `bash scripts/verify-release-tag.sh`，**一个参数都没传**，
    #       而脚本第一行就是 `REPO="${1:?repo, e.g. owner/name}"` ——
    #       真跑起来会立刻死在 `line 16: 1: repo, e.g. owner/name`，
    #       和「tag 真的漂了」在 job 状态上都是一个红。
    #
    # 因为 (1) 让它从来没被触发过，(2) 就一直没人发现。实测：published artifact
    # drift 最近 3 次运行，这个 job 全部 skipped。
    #
    # 为什么不做成定时跑：脚本校验的是「tag 剥出的 commit == 打包用的 commit」，
    # 而"打包用的 commit"只有发版的人手上有，定时跑推不出来。所以它只能是
    # on-demand，参数从 workflow_dispatch inputs 来。
    if: github.event_name == 'workflow_dispatch' && inputs.release_repo != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: verify release tags point at the commit they were built from
        run: |
          set -euo pipefail
          # 三个都必须非空 —— 缺一个就让它明确失败，而不是让脚本吐
          # `${1:?...}` 那种看起来像脚本坏了的信息。
          : "${RELEASE_REPO:?release_repo is required}"
          : "${RELEASE_TAG:?release_tag is required}"
          : "${BUILD_SHA:?build_sha is required}"
          bash scripts/verify-release-tag.sh "$RELEASE_REPO" "$RELEASE_TAG" "$BUILD_SHA"
        env:
          RELEASE_REPO: ${{ inputs.release_repo }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_SHA: ${{ inputs.build_sha }}

  published-build-paths:
    # 已发布的产物里不许内联构建机的绝对路径（#732）。
    #
    # 🔴 判据必须包含**解码**这一层。dist 是 javascript-obfuscator 处理过、且
    #    --string-array-encoding base64 的，对它裸 grep '/home/' 必然得 0 ——
    #    而那个 0 的含义是「没有那个形状」，不是「没有那件事」。
    #
    # 放在定时面而不是 per-PR：它检查的是**已发布产物**，PR 改不动它；而且要联网
    # 取包，per-PR 会给每次合并加一条网络依赖。这和同一个 workflow 里另外三个 job
    # 的理由一致。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 先跑判据自检。这道门最可能的坏法不是判据写错，是**第三层没接上**然后打印
      # 一片绿 —— selftest 里那条 base64 藏匿夹具专门钉这一格。
      - run: python3 .github/scripts/check-published-build-paths.py --selftest
      - run: |
          python3 .github/scripts/check-published-build-paths.py \
            @sleep2agi/agent-network@latest \
            @sleep2agi/agent-network@preview \
            @sleep2agi/agent-node@latest \
            @sleep2agi/agent-node@preview

  docs-site-drift:
    # anet.sh 没有接 git 自动部署:合并进 main 不会让站点更新,必须有人手动
    # 跑预构建部署。这条链路的失败方式是**静默分叉** —— 站点照常 200,
    # 只是内容停在某次部署。仓里记录过停 36 小时、以及冻结近 14 天。
    #
    # 🔴 和上面两个 job 同一个理由放在定时里:它检查的是**已部署的站点**,
    #    PR 不改变它,而且需要外网。放进 per-PR 只会给每次合并加一个网络依赖。
    #
    # 红了指向的动作是唯一且明确的:让 `deploy-anet-sh` 跑一次,或从 origin/main 的
    # worktree 走预构建部署(`vercel build --prod` + `vercel deploy --prebuilt --prod`)。
    name: docs-site-drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 🔴 只给这一个 job、只给它要用的那一格权限。
    #    通知需要开/更新 issue;它不需要写仓库内容。
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要历史才能取「最近新增的行」——指纹只从那里选,见脚本注释。
          fetch-depth: 80
      - run: python3 .github/scripts/check-docs-site-drift.py --selftest
      # #1482 —— latest 戳从来没有被任何东西比对过(发版模式只比"正在发的通道"的戳),
      # 于是它自 2.2.21 起一直漂,而正文照着它对 latest 用户说了假话。
      # 放在这个 workflow 里:它已经要联网、已经是每日跑,而且红了会走上面那条
      # tracker issue 通知 —— per-PR 不加网络依赖。
      - name: latest 戳 vs npm dist-tags.latest (#1482)
        run: python3 scripts/check-doc-version-claims.py --verify-latest-from-npm
      - name: check anet.sh against main
        id: drift
        run: |
          set +e
          python3 .github/scripts/check-docs-site-drift.py > drift.out 2>&1
          rc=$?
          set -e
          # 🔴 退出码不穿管道:先落进变量,再写 output。
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat drift.out
      # 方案 D:把结论送到人眼前。那道门连红 8 天没人动 ⇒
      # 「Actions 里变红」已被实测证明不是一个通知渠道。
      - name: open / update / close the tracking issue
        if: always() && steps.drift.outputs.rc != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.drift.outputs.rc }}
          DRIFT_OUT: drift.out
        run: bash .github/scripts/docs-site-drift-notify.sh
      # 🔴 判定仍由脚本自己的退出码决定 —— 通知是附加的,不改红绿。
      - name: re-raise the check's exit code
        if: always()
        run: exit ${{ steps.drift.outputs.rc }}

  # #1693 —— 这个 workflow 有四个 job，报的是**三件互不相关的真事**，
  # 但只有 `docs-site-drift` 那一条会落成 issue（它带 docs-site-drift-notify.sh）。
  # 另外两条只是 CI 里的一个红点，而三个 job 共用同一个红点 ⇒ 看到红的人很容易
  # 读成「就是那条 docs-site 的老问题」，**两条真问题就此隐身**。
  # 其中一条报的是**已发布 npm 包里带构建机路径**（#1433）——它从 08-30 起连红 6 次，
  # 没有任何人被通知到。
  #
  # 🔴 这里**不加**第二个自动开 issue 的 tracker：#1692 那种 tracker 已经每天更新一次，
  #    再加两个是提高告警密度，那是产品姿态判断，不该由一道 CI 改动顺手决定。
  #    这个 job 只做一件事：**把红点点开就能看到是哪几条**。
  #    它不改任何判据、不新增失败模式（`if: always()` + 自身恒成功）。
  drift-summary:
    name: drift-summary
    needs: [published-pins, published-build-paths, docs-site-drift]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 把三条结论写进 run summary
        env:
          R_PINS: ${{ needs.published-pins.result }}
          R_PATHS: ${{ needs.published-build-paths.result }}
          R_DOCS: ${{ needs.docs-site-drift.result }}
        run: |
          set -uo pipefail
          mark() { case "$1" in success) echo '✅';; failure) echo '🔴';; skipped) echo '⏭️';; *) echo "❔($1)";; esac; }
          {
            echo "## published artifact drift —— 三条互不相关的检查"
            echo
            echo "| job | 结果 | 它在报什么 |"
            echo "|---|---|---|"
            echo "| \`published-pins\` | $(mark "$R_PINS") | 源码里的版本戳 vs **已发布产物里的版本**（对不上通常意味着某个包还没发） |"
            echo "| \`published-build-paths\` | $(mark "$R_PATHS") | 已发布的 npm 包里有没有**构建机的绝对路径**（#1433） |"
            echo "| \`docs-site-drift\` | $(mark "$R_DOCS") | anet.sh 落后于 main（这一条**会**自动开/更新 issue） |"
            echo
            echo "🔴 只有最后一条会落成 issue。前两条红的时候，除了这个红点没有别的地方会说。"
            echo "点开对应 job 的日志看具体一行。"
          } >> "$GITHUB_STEP_SUMMARY"
