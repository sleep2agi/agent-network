name: OpenCode V2 portable client
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'tests/test883-v2-portable-client/**'
      - 'tests/test543-opencode-v2-copresence/stub-model.py'
      - 'agent-network/**'
      - 'agent-node/**'
      - 'server/**'
      - '.github/workflows/v2-portable-client.yml'
  # Tier 3: heavy Docker suite. Runs nightly on main, on demand, or on PRs labelled full-qa.
  # It no longer runs on every merge to main (2 runners; it queued PR feedback).
  schedule:
    - cron: '40 18 * * *'
permissions:
  contents: read
# #2136 —— 同一 PR 重新 push 时**取消上一轮还在排队的运行**。
# 2026-10-25 实测:一条 PR 反复 push 会留下 28 个过期 workflow 一直占着 runner 队列,
# 新提交反而排不上(当天三条 PR 全卡在 queued)。只在 pull_request 上取消:
# 主分支的 push 运行不取消 —— 那可能是发布/部署门。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  real-client:
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-qa')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build from tracked source and run isolated positive then negative
        run: sg docker -c 'ARTIFACT_DIR=/tmp/test883-artifacts bash tests/test883-v2-portable-client/ci.sh'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-only-v2-portable-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/test883-artifacts
          retention-days: 7
