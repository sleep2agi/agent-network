name: Task sender core
on:
  pull_request:
    paths:
      - 'server/src/rest-identity*'
      - 'server/src/tools.ts'
      - 'server/src/db.ts'
      - 'server/src/server.ts'
      - 'server/src/task-sender-http.test.ts'
      - 'server/src/task-auth-origin-http.test.ts'
      - 'server/src/task-network-resolution-http.test.ts'
      - 'server/src/dashboard-slash-routing-http.test.ts'
      - 'tests/test696-task-sender/**'
      - '.github/workflows/task-sender-core.yml'
permissions:
  contents: read
# #2136 —— 同一 PR 重新 push 时**取消上一轮还在排队的运行**。
# 2026-10-25 实测:一条 PR 反复 push 会留下 28 个过期 workflow 一直占着 runner 队列,
# 新提交反而排不上(当天三条 PR 全卡在 queued)。只在 pull_request 上取消:
# 主分支的 push 运行不取消 —— 那可能是发布/部署门。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  task-sender:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build isolated HTTP test image
        run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -t task-sender-test -f tests/test696-task-sender/Dockerfile .
      - name: SQLite and PostgreSQL sender contracts and assertion witnesses
        run: docker run --rm --init --network none task-sender-test
      - name: Existing transport and origin contracts
        run: docker run --rm --init --network none --entrypoint bash task-sender-test -lc 'unset DATABASE_URL COMMHUB_TEST_PG_URL; COMMHUB_DB=/tmp/sender-regressions.db bun test src/rest-identity.test.ts src/task-auth-origin-http.test.ts src/task-network-resolution-http.test.ts src/dashboard-slash-routing-http.test.ts'
