name: Password network token core
on:
  pull_request:
    paths:
      - 'server/src/auth.ts'
      - 'server/src/password-network-tokens.ts'
      - 'server/src/server.ts'
      - 'server/src/auth-password-change-cli-tokens-http.test.ts'
      - 'tests/test717-password-network/**'
      - '.github/workflows/password-network-core.yml'
permissions:
  contents: read
jobs:
  password-network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -t password-network-test -f tests/test717-password-network/Dockerfile .
      - run: docker run --rm --init --network none password-network-test
