name: Password network token core
on:
  pull_request:
    paths:
      - 'server/src/auth.ts'
      - 'server/src/password-network-tokens.ts'
      - 'server/src/server.ts'
      - 'server/src/auth-password-change-cli-tokens-http.test.ts'
      - 'tests/test717-password-network/**'
      - '.github/workflows/password-network-core.yml'
permissions:
  contents: read
# #2136 —— 同一 PR 重新 push 时**取消上一轮还在排队的运行**。
# 2026-10-25 实测:一条 PR 反复 push 会留下 28 个过期 workflow 一直占着 runner 队列,
# 新提交反而排不上(当天三条 PR 全卡在 queued)。只在 pull_request 上取消:
# 主分支的 push 运行不取消 —— 那可能是发布/部署门。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  password-network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -t password-network-test -f tests/test717-password-network/Dockerfile .
      - run: docker run --rm --init --network none password-network-test
