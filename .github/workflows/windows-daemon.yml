name: Windows daemon
on:
  pull_request:
    paths:
      - "agent-node/**"
      - "agent-network/**"
      - ".github/workflows/windows-daemon.yml"
      - "tests/test-rfc044-windows-daemon/**"
      - "server/src/windows-sdk-stop-wire.test.ts"
      - "server/src/tools.ts"
  push:
    branches: [main]
concurrency:
  group: windows-daemon-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  paths:
    name: Windows daemon path primitives (not E2E)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Private HOME and shell-free JS launch on native Windows
        run: bun test agent-node/src/runtime/daemon-cli-launch.test.ts agent-node/src/runtime/daemon-windows-paths.test.ts agent-node/src/runtime/stop-daemon-windows.test.ts agent-network/src/windows-runtime.test.ts
  sdk-smoke:
    name: Native ${{ matrix.os }} daemon SDK first reply
    needs: paths
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: agent-network
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: agent-node
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: server
      - run: bun tests/test-rfc044-windows-daemon/build.ts
      - name: Real local Hub to daemon to Claude SDK with model HTTP stub
        run: bun tests/test-rfc044-windows-daemon/smoke.ts
  linux-smoke:
    name: Linux daemon SDK regression (Docker)
    needs: paths
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f tests/test-rfc044-windows-daemon/Dockerfile.smoke -t anet-rfc044-sdk-smoke .
      - name: Windows stop ACK payloads against the actual Hub schema (Docker)
        run: docker run --rm --network none --entrypoint bun anet-rfc044-sdk-smoke test server/src/windows-sdk-stop-wire.test.ts
      - run: docker run --rm --network none anet-rfc044-sdk-smoke
