name: Release main SHA guard test
on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-main-sha-test.yml'
      - '.github/scripts/verify-release-main.sh'
      - 'tests/release-main-sha/**'
      - '.github/scripts/verify-npm-publish-visible.sh'
      - 'tests/release-publish-visible/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-main-sha-test.yml'
      - '.github/scripts/verify-release-main.sh'
      - 'tests/release-main-sha/**'
      - '.github/scripts/verify-npm-publish-visible.sh'
      - 'tests/release-publish-visible/**'
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f tests/release-main-sha/Dockerfile -t release-main-sha-test .
      - run: docker run --rm release-main-sha-test
  # #582:release.yml「发后核实」的轮询/超时/字节不符三种判定(桩 curl,无网络)
  publish-visible:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f tests/release-publish-visible/Dockerfile -t release-publish-visible-test .
      - run: docker run --rm release-publish-visible-test
