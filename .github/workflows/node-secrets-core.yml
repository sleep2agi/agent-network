name: Independent node secrets core
on:
  pull_request:
    paths:
      - 'server/src/scoped-secrets*'
      - 'server/src/tools.ts'
      - 'agent-node/src/runtime/node-secrets.ts'
      - 'agent-node/src/shared/scoped-secret*'
      - 'agent-node/src/cli.ts'
      - 'agent-network/src/shared/scoped-secret*'
      - 'tests/test1075-node-secrets/**'
      - '.github/workflows/node-secrets-core.yml'
permissions:
  contents: read
jobs:
  node-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build isolated TEST-ONLY core
        run: sg docker -c 'docker build -f tests/test1075-node-secrets/Dockerfile -t node-secrets-test .'
      - name: Unbound persistence and actual startup child
        run: sg docker -c 'docker run --rm --network none node-secrets-test'
