name: Node session control relay
on:
  pull_request:
    paths:
      - 'server/**'
      - 'tests/test2017-node-session-control/**'
      - '.github/workflows/node-session-control.yml'
  workflow_dispatch:
permissions:
  contents: read
# #2136 —— 同一 PR 重新 push 时**取消上一轮还在排队的运行**。
# 2026-10-25 实测:一条 PR 反复 push 会留下 28 个过期 workflow 一直占着 runner 队列,
# 新提交反而排不上(当天三条 PR 全卡在 queued)。只在 pull_request 上取消:
# 主分支的 push 运行不取消 —— 那可能是发布/部署门。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  relay-http:
    name: node session control HTTP (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build exact checkout
        run: docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" -t anet-session-control -f tests/test2017-node-session-control/Dockerfile .
      - name: Run scoped relay witnesses
        run: docker run --rm --init --cpus=2 --network none anet-session-control
