name: Exact CLI runtime pair core
on:
  pull_request:
    paths:
      - 'agent-network/package*.json'
      - 'agent-node/package*.json'
      - 'agent-network/src/opencode-agent-node-pair*'
      - 'tests/test906-provider-create/Dockerfile.pair'
      - '.github/workflows/release-pair-core.yml'
  # #1976 —— 成对校验也要在 main 上跑。
  #
  # 事故(2026-10-20/21):agent-node 发了 preview.151,而 agent-network 里的
  # PAIRED_AGENT_NODE_VERSION 还钉在 .150。这个工作流只在 PR 与手动 dispatch 时跑,
  # 于是 main 上**没有任何一个 job 叫「配对」** —— 版本漂移是从
  # `hub semantics + guards` 那一族 15 个 job 的红里冒出来的(每个红都指向别的失败,
  # 没有人一眼看出「是一个常量没跟上」)。#2861 那一行 .150→.151 就是实证。
  #
  # 有了这个 push 触发:同样的漂移会在**配对这一个 job** 上红,报错直接指向常量。
  # 代价是每次 main push 多一个 5 分钟的 job。
  push:
    branches: [main]
    paths:
      - 'agent-network/package*.json'
      - 'agent-node/package*.json'
      - 'agent-network/src/opencode-agent-node-pair*'
      - 'tests/test906-provider-create/Dockerfile.pair'
      - '.github/workflows/release-pair-core.yml'
  workflow_dispatch:
permissions:
  contents: read
# #2136 —— 同一 PR 重新 push 时**取消上一轮还在排队的运行**。
# 2026-10-25 实测:一条 PR 反复 push 会留下 28 个过期 workflow 一直占着 runner 队列,
# 新提交反而排不上(当天三条 PR 全卡在 queued)。只在 pull_request 上取消:
# 主分支的 push 运行不取消 —— 那可能是发布/部署门。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build exact-source TEST-ONLY metadata fixture
        run: sg docker -c 'docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" -f tests/test906-provider-create/Dockerfile.pair -t release-pair-core .'
      - name: Exact pair and package lock consistency
        run: sg docker -c 'docker run --rm --network none -e EXPECTED_SOURCE_COMMIT="$GITHUB_SHA" release-pair-core'
