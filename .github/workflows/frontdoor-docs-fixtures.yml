name: Original frontdoor docs fixtures
on:
  pull_request:
    paths:
      - 'README.md'
      - 'README.en.md'
      - 'docs/archive/upgrade-v2.md'
      - 'docs-site/**'
      - 'tests/qa-frontdoor-docs/**'
      - '.github/workflows/frontdoor-docs-fixtures.yml'
  workflow_dispatch:
permissions:
  contents: read
# #2136 —— 同一 PR 重新 push 时**取消上一轮还在排队的运行**。
# 2026-10-25 实测:一条 PR 反复 push 会留下 28 个过期 workflow 一直占着 runner 队列,
# 新提交反而排不上(当天三条 PR 全卡在 queued)。只在 pull_request 上取消:
# 主分支的 push 运行不取消 —— 那可能是发布/部署门。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  frontdoor-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build original suite with pinned Node and npm lock
        run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -f tests/qa-frontdoor-docs/Dockerfile -t frontdoor-fixture-test .
      - name: Complete original render baseline and witnessed-red inputs
        shell: bash
        run: |
          set -euo pipefail
          for fixture_case in baseline old-path missing-note; do
            docker run --rm --init --network none -e FIXTURE_CASE="$fixture_case" -e EXPECTED_SOURCE_COMMIT=${{ github.sha }} --entrypoint node frontdoor-fixture-test tests/qa-frontdoor-docs/controls.mjs 2>&1 | tee -a report-test1289.txt
          done
          echo 'RESULT: PASS; original complete baseline and two exact witnessed-red inputs' | tee -a report-test1289.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TEST-ONLY-frontdoor-docs-${{ github.sha }}
          path: report-test1289.txt
