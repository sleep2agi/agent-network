# 测试清单棘轮：**允许新增，不允许消失**。
#
# 为什么按「名字集合」而不是计数：
#   2026-10-31 一次「两个锚点之间整段替换」把两条测试连同区间内容一起删掉，
#   同时新增了另外两条 ⇒ 测试总数 31 → 31，看起来没变。
#   ⇒ 计数相同 ≠ 覆盖相同；集合差集才是唯一通用的检测器（也覆盖「测试文件被整段替换」）。
#
# 判据：基线里有、现在没有 ⇒ 红。新增 ⇒ 绿并提示落基线。
# 脚本每次都打印 literal / dynamic 两条分母 —— dynamic 那部分不受棘轮保护，
# 不打印就会被读成「全覆盖」。

name: lint (test inventory)

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ratchet:
    name: test-inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 2026-10-31 —— 「先证仪器，再读世界」：剥字符串状态机有自己的自检（7 例，含 1 个必须红的负例）。
      # 主跑里也会先跑一遍（quiet），不过 ⇒ 退出码 2（没有读数）。
      - name: the string-stripping state machine passes its own fixtures
        run: python3 scripts/check-test-inventory.py --selftest
      - name: no test may disappear without an explicit baseline update
        run: python3 scripts/check-test-inventory.py
      # 2026-10-31 —— 「义务已写进文件，缺的只是执行者」。
      # 这个门存在了一整晚，但没有任何 workflow 调过它：
      # 名字像 gate 却只手动的 workflow，等于一道没人记得点的门。
      # ⇒ 现在它必须自己跑：名字像门（gate|qa|check）却只手动 ⇒ 红。
      - name: gate-shaped workflows must not be manual-only
        run: python3 scripts/report-workflow-triggers.py --assert
      # 2026-10-31 —— 同一晚第二遍「义务没有执行者」：
      # 这三个 check-*.py 存在但没有任何 workflow / qa.sh 引用它们。
      # 实测三者当前都 exit=0，所以接线不会把 CI 变红；不接线则它们只是文档。
      # 2026-10-31 —— 「去跑 X」之前先证 X 存在：
      # 我今晚让人跑过一个不存在的判别器（?probe=1），而它返回的是**合理读数**。
      - name: every scripts/… reference must resolve to a real file
        run: python3 scripts/check-script-references.py
      # 2026-10-31 —— 反方向：引用了的东西存在（上一行），**存在的东西有人跑**（这一行）。
      # 一个写好了却没有任何调用者的脚本，失效速度是 0 —— 不是很小，是 0。
      # 它不要求每个脚本都进 CI；它要求每个脚本都落进三档之一，ADHOC 必须有「谁会发现它烂了」+「什么时候删这一行」。
      - name: every script has a discoverer when it stops running
        run: python3 scripts/report-script-cadence.py --assert
      # 2026-10-31 —— 上一轮给 check-keyset-join.py 加了 --json，但 consumers 那栏只写了人。
      # 一个只为「人读」存在的 JSON，与散文的差别只剩格式：它照样可以被悄悄改坏而无人发现。
      # 这个消费者就是那个「谁在用」：缺键 / 缺 env / 缺 check / consumers 空 ⇒ 红。
      - name: the SCOPE JSON has a real consumer (structure, provenance, lifetime)
        run: python3 scripts/check-scope-json.py
      - name: orphan checks that were never executed (now wired)
        run: |
          python3 scripts/check-hub-v2-protocol-inputs.py
          python3 scripts/check-mcp-tool-anchor-sections.py
          python3 scripts/check-mcp-tool-index-coverage.py
