# 测试清单棘轮：**允许新增，不允许消失**。
#
# 为什么按「名字集合」而不是计数：
#   2026-10-31 一次「两个锚点之间整段替换」把两条测试连同区间内容一起删掉，
#   同时新增了另外两条 ⇒ 测试总数 31 → 31，看起来没变。
#   ⇒ 计数相同 ≠ 覆盖相同；集合差集才是唯一通用的检测器（也覆盖「测试文件被整段替换」）。
#
# 判据：基线里有、现在没有 ⇒ 红。新增 ⇒ 绿并提示落基线。
# 脚本每次都打印 literal / dynamic 两条分母 —— dynamic 那部分不受棘轮保护，
# 不打印就会被读成「全覆盖」。

name: lint (test inventory)

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ratchet:
    name: test-inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 2026-10-31 —— 「先证仪器，再读世界」：剥字符串状态机有自己的自检（7 例，含 1 个必须红的负例）。
      # 主跑里也会先跑一遍（quiet），不过 ⇒ 退出码 2（没有读数）。
      - name: the string-stripping state machine passes its own fixtures
        run: python3 scripts/check-test-inventory.py --selftest
      - name: no test may disappear without an explicit baseline update
        run: python3 scripts/check-test-inventory.py
      # 2026-10-31 —— 「义务已写进文件，缺的只是执行者」。
      # 这个门存在了一整晚，但没有任何 workflow 调过它：
      # 名字像 gate 却只手动的 workflow，等于一道没人记得点的门。
      # ⇒ 现在它必须自己跑：名字像门（gate|qa|check）却只手动 ⇒ 红。
      - name: gate-shaped workflows must not be manual-only
        run: python3 scripts/report-workflow-triggers.py --assert
      # 2026-10-31 —— 同一晚第二遍「义务没有执行者」：
      # 这三个 check-*.py 存在但没有任何 workflow / qa.sh 引用它们。
      # 实测三者当前都 exit=0，所以接线不会把 CI 变红；不接线则它们只是文档。
      # 2026-10-31 —— 「去跑 X」之前先证 X 存在：
      # 我今晚让人跑过一个不存在的判别器（?probe=1），而它返回的是**合理读数**。
      - name: every scripts/… reference must resolve to a real file
        run: python3 scripts/check-script-references.py
      # 2026-10-31 —— 反方向：引用了的东西存在（上一行），**存在的东西有人跑**（这一行）。
      # 一个写好了却没有任何调用者的脚本，失效速度是 0 —— 不是很小，是 0。
      # 它不要求每个脚本都进 CI；它要求每个脚本都落进三档之一，ADHOC 必须有「谁会发现它烂了」+「什么时候删这一行」。
      - name: every script has a discoverer when it stops running
        run: python3 scripts/report-script-cadence.py --assert
      # 2026-10-31 —— `trap '<...> exit 1' ERR` 会把 RC 采集吃掉：`RC=$?` 到不了，
      # 于是「已失效（2）」被读成「未预期（1）」，动作从「更新卡」错到「查脚本」。
      # 本脚本自带 must-fire（--selftest 5 例，含 1 个必须红的负例）。
      # 2026-10-31 —— curl 退出码分层的帮助函数：它自己也会烂（码表被改、case 漏一格），
      # 所以自检必须由 CI 跑，而不是靠人记得 `bash scripts/lib/curl-exit.sh --selftest`。
      # 2026-10-31 —— 「这条判据的副本有几份？」：31 组逐字符相同的同名文件跨 3 个包。
      # 任何单侧改动都会让副本分叉，而改的那一侧不知道另一端。
      # 分叉不一定是错，但必须是显式决定（改回去 / 删基线行并说明）。
      # 2026-10-31 —— 生成物的唯一风险不是它错，是它**停在过去某一天**。
      # docs/rest-route-table.json 写着「重跑后不一致 ⇒ 过期」，但没有任何东西去重跑。
      # 这条就是那个消费者：源码变了而表没跟上 ⇒ 红。
      - name: generated REST route table is not stale
        run: python3 scripts/check-rest-route-table.py
      # 2026-10-31 —— 顺序承载语义：`/api/messages?scope=user` 必须排在通用分支之前。
      # 静态不变量，不替代行为测试；它挡的是「重构时顺手排序」。
      # 同时钉住「哪些 path 应该有 query 判别」——判别消失会让不变量静默跳过。
      - name: specific query discriminators still precede generic branches
        run: python3 scripts/check-rest-route-order.py
      # 2026-10-31 —— 「名字像测试但没有 runner」：当前未归属 0。
      # 接线之后，任何新增的 *.test.mjs / *.pw.ts 若没接进任何 runner ⇒ 红。
      - name: no test-looking file is missing a runner
        run: python3 scripts/report-orphan-tests.py
      # 2026-10-31 —— 恒真断言（两侧同一**纯取值**表达式）永远不可能变红。
      # 静态只能查这一类；「两侧同源但不同表达式」要靠人读，脚本自己写着这条局限。
      # 2026-10-31 —— 兼容字段 `license` 的**生产不可达护栏**：它区分不了
      # 「没有授权」与「没查到」，所以只许出现在渲染点与赋值点。
      - name: legacy license field has no production readers
        run: |
          python3 scripts/check-legacy-license-usage.py --selftest
          python3 scripts/check-legacy-license-usage.py
      - name: no assertion compares a value to itself
        run: |
          python3 scripts/report-vacuous-assertions.py --selftest
          python3 scripts/report-vacuous-assertions.py
      - name: duplicated criteria copies have not silently diverged
        run: |
          python3 scripts/report-contract-pairs.py --selftest
          python3 scripts/report-contract-pairs.py --assert
      - name: the curl exit-code classifier still classifies the layers we rely on
        run: bash scripts/lib/curl-exit.sh --selftest
      - name: no shell trap may overwrite the exit code
        run: |
          python3 scripts/check-shell-rc-capture.py --selftest
          python3 scripts/check-shell-rc-capture.py
      # 2026-10-31 —— 上一轮给 check-keyset-join.py 加了 --json，但 consumers 那栏只写了人。
      # 一个只为「人读」存在的 JSON，与散文的差别只剩格式：它照样可以被悄悄改坏而无人发现。
      # 这个消费者就是那个「谁在用」：缺键 / 缺 env / 缺 check / consumers 空 ⇒ 红。
      - name: the SCOPE JSON has a real consumer (structure, provenance, lifetime)
        run: python3 scripts/check-scope-json.py
      # 2026-10-31 —— 今晚新增的两道门接进 CI。
      # 判据：一个只在人肉跑的门，与「没写」的区别是**有人记得**；而 CI 负责让人不用记得。
      - name: jq `//` never folds "absent" into "pass" (fail-open)
        run: |
          python3 scripts/check-jq-default-operator.py --selftest
          python3 scripts/check-jq-default-operator.py
      - name: empty-equality scan (advisory: only the gate path must be clean)
        # tests/ 与 docs/ 里的 before/after 比较大多是 fail-closed（另一侧是字面量），
        # 所以这条**不阻塞**；它每天把 gate 路径的读数打出来，变红了才有人看。
        run: python3 scripts/check-shell-empty-equality.py
      # 2026-10-31 —— /tmp 卫生：固定路径必须登记（并发 / 预置 / 残留三条）。
      - name: fixed /tmp paths are registered (with a reason each)
        run: |
          python3 scripts/check-tmp-hygiene.py --selftest
          python3 scripts/check-tmp-hygiene.py
      - name: orphan checks that were never executed (now wired)
        run: |
          python3 scripts/check-hub-v2-protocol-inputs.py
          python3 scripts/check-mcp-tool-anchor-sections.py
          python3 scripts/check-mcp-tool-index-coverage.py
