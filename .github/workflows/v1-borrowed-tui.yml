name: V1 borrowed native TUI
on:
  pull_request:
    paths:
      - 'agent-node/src/cli.ts'
      - 'agent-node/src/runtime/opencode-copresence/v1-borrowed-tui.ts'
      - 'agent-node/src/shared/opencode-borrowed-launch-health.ts'
      - 'agent-network/src/shared/opencode-borrowed-launch-health.ts'
      - 'agent-node/src/runtime/start-daemon.ts'
      - 'agent-node/src/runtime/opencode-start-completion*.ts'
      - 'agent-node/src/runtime/opencode-copresence/launcher-health*.ts'
      - 'agent-network/bin/cli.ts'
      - 'agent-node/src/runtime/opencode-copresence/v1-borrowed-cli*.ts'
      - 'agent-node/src/runtime/opencode-copresence/runtime.ts'
      - 'agent-node/src/runtime/opencode-backend.ts'
      - 'agent-node/src/runtime/opencode-copresence/reply-ownership.ts'
      - 'agent-node/src/runtime/opencode-copresence/v1-host-*.ts'
      - 'agent-node/src/runtime/opencode-copresence/v1-scoped-mcp.ts'
      - 'agent-node/src/runtime/opencode-copresence/v1-borrowed-admission.ts'
      - 'agent-node/src/runtime/opencode-copresence/v1-shared-read.ts'
      - 'agent-node/src/runtime/opencode-copresence/process-group.ts'
      - 'agent-node/src/runtime/opencode-acp/binary.ts'
      - 'deploy/node/opencode-v1-host/**'
      - 'tests/test1226-v1-borrowed-tui/**'
      - 'tests/test651-opencode-timeout-abort/**'
      - 'tests/test1194-v1-shared-feasibility/package-integrity.json'
      - '.github/workflows/v1-borrowed-tui.yml'
  workflow_dispatch:
permissions:
  contents: read
# #2136 —— 同一 PR 重新 push 时**取消上一轮还在排队的运行**。
# 2026-10-25 实测:一条 PR 反复 push 会留下 28 个过期 workflow 一直占着 runner 队列,
# 新提交反而排不上(当天三条 PR 全卡在 queued)。只在 pull_request 上取消:
# 主分支的 push 运行不取消 —— 那可能是发布/部署门。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-tui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        version: ['1.18.1', '1.18.34']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build pinned exact native fixture
        run: docker build --build-arg OPENCODE_VERSION=${{ matrix.version }} --build-arg SOURCE_COMMIT=${{ github.sha }} -f tests/test1226-v1-borrowed-tui/Dockerfile -t v1-borrowed-tui-test .
      - name: Two actual interactive native TUIs on original sessions and own lifecycle
        shell: bash
        run: |
          set -uo pipefail
          # #2398 —— 这条 job 是**已知的时序 flake**：一晚三次在三个互不相干的 PR 上红、
          # 同一提交重跑即绿（断言：TUI 渲染完成后 attach 的 Unicode 目录/会话身份）。
          # 这里只做**有界重试一次**（最多 2 次），并逐次留下日志；
          # **没有**放宽任何断言、没有跳过任何检查 —— 真缺陷仍然会让两次都红。
          # 真修（把固定等待换成可观测就绪判据）单独排期，见 #2398。
          rc=1
          attempt=0
          for attempt in 1 2; do
            echo "::group::attempt ${attempt}/2"
            docker run --rm --init --network none -e EXPECTED_SOURCE_COMMIT=${{ github.sha }} v1-borrowed-tui-test 2>&1 \
              | tee "report-test1226-tui-${{ matrix.version }}.attempt${attempt}.txt"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then break; fi
            if [ "$attempt" -lt 2 ]; then
              echo "::warning::attempt ${attempt} failed rc=${rc}; retrying once (known timing flake, #2398)"
              docker image prune -f >/dev/null 2>&1 || true
              sleep 5
            fi
          done
          cp "report-test1226-tui-${{ matrix.version }}.attempt${attempt}.txt" "report-test1226-tui-${{ matrix.version }}.txt" 2>/dev/null || true
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TEST-ONLY-v1-borrowed-tui-${{ matrix.version }}-${{ github.sha }}
          path: report-test1226-tui-${{ matrix.version }}.txt
