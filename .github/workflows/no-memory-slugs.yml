# Block internal memory-slug references from leaking into public OSS files.
#
# Runs the Python grep guard in .github/scripts/check-no-memory-slugs.py
# on every PR + main push. Fails the build on any unexpected
# `[[feedback_*]]` / `[[project_*]]` / `[[reference_*]]` / `[[user_*]]`
# reference in source / docs (with a tree-prefix allowlist for the
# legacy documentation areas tracked under a separate backlog issue —
# see the script for the current allowlist).
#
# Python (not in-yml bash sed loop) per the team's CI-guard pattern:
# multi-pattern scans on large repos can run pathologically slow under
# bash on Windows runners; a small Python script is portable and easy
# to extend.

name: lint (no internal memory-slug leak)

on:
  # 🔴 刻意不加 paths 过滤。原来这里列了 12 条(`**/*.ts` `**/*.md` `**/*.yml` …),
  # 而**脚本自己扫的后缀集合里还有 `.sh` 和 `.py`** —— 它们不在触发列表里。
  # 实测这个缺口的大小:仓里 2032 个跟踪文件中,**改动它不会触发这道门**的有 999 个,
  # 其中 `.sh` 288 个、`.py` 22 个 —— 而这两类**正是脚本会扫的**。
  #
  # 也就是说:一个只改 .sh 的 PR 里,内部记忆 slug 可以直接进公开仓,
  # 而这道门**不是判错,是压根不会被触发**。
  #
  # 去掉过滤同时解决第二件事:带 paths 的 workflow 在不匹配的 PR 上不产生 check-run,
  # 于是**永远做不了 required check**(会卡在 Expected — Waiting for status)。
  # 这是一道隐私门,应当能进 required。
  #
  # 代价实测:main 上最近三次运行 11s / 10s / 14s。
  pull_request:
  push:
    branches: [main]

jobs:
  no-memory-slugs:
    name: no internal [[feedback_*]] slug references
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Run check-no-memory-slugs.py
        run: python3 .github/scripts/check-no-memory-slugs.py .

      # 🔴 互验:workflow 结构门主要由 workflow-structure.yml 跑。但那个文件自己
      #    被合坏时(同一次合并把它的 runs-on/steps 抽走),它就再也不会被调用 ——
      #    而那正是它要抓的那种「空壳 job」。所以这里再跑一遍。
      #    这个 job 兜得住它,是因为本 workflow 的触发含 '**/*.yml':任何
      #    workflow 文件的改动都会到这里。
      - name: Run check-workflow-structure.py (mutual validation)
        run: |
          pip install --quiet --require-hashes -r .github/scripts/requirements-workflow-structure.txt
          python3 .github/scripts/check-workflow-structure.py .
