name: Scheduled successful work outcome
on:
  pull_request:
    paths:
      - 'server/src/scheduled-*.ts'
      - 'server/src/db.ts'
      - 'server/src/tools.ts'
      - 'server/src/auth.ts'
      - 'server/src/server.ts'
      - 'server/package*.json'
      - 'tests/test1274-scheduled-work-outcome/**'
      - 'tests/test601-hub-scheduled-tasks/**'
      - '.github/workflows/scheduled-work-outcome.yml'
  workflow_dispatch:
permissions:
  contents: read
# #2136 —— 同一 PR 重新 push 时**取消上一轮还在排队的运行**。
# 2026-10-25 实测:一条 PR 反复 push 会留下 28 个过期 workflow 一直占着 runner 队列,
# 新提交反而排不上(当天三条 PR 全卡在 queued)。只在 pull_request 上取消:
# 主分支的 push 运行不取消 —— 那可能是发布/部署门。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  work-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build independent pinned fixture
        run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -f tests/test1274-scheduled-work-outcome/Dockerfile -t scheduled-work-outcome-test .
      - name: Real SQLite HTTP MCP and lifecycle regressions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --init --network none -e EXPECTED_SOURCE_COMMIT=${{ github.sha }} scheduled-work-outcome-test 2>&1 | tee report-test1274.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TEST-ONLY-scheduled-work-outcome-${{ github.sha }}
          path: report-test1274.txt
