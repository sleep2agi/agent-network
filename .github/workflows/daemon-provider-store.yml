name: Daemon Provider persistence
on:
  pull_request:
    paths:
      - 'agent-network/**'
      - 'agent-node/src/**'
      - 'server/**'
      - 'tests/test906-daemon-provider-management/**'
      - '.github/workflows/daemon-provider-store.yml'
  push:
    branches: [main]
    paths:
      - 'agent-network/**'
      - 'agent-node/src/**'
      - 'server/**'
      - 'tests/test906-daemon-provider-management/**'
      - '.github/workflows/daemon-provider-store.yml'
permissions:
  contents: read
jobs:
  existing-discovery:
    name: daemon-existing-codex-discovery (Docker, read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Private legacy layout and HTTP daemon discovery core
        run: |
          sg docker -c 'docker build -f tests/test906-daemon-provider-management/Dockerfile.discovery -t anet-provider-management:test906-discovery .'
          sg docker -c 'docker run --init --rm --network none anet-provider-management:test906-discovery'
  managed-login:
    name: daemon-managed-login (Docker, no account sign-in)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Login lifecycle and native empty-account protocol (offline)
        run: |
          sg docker -c 'docker build -f tests/test906-daemon-provider-management/Dockerfile.login -t anet-provider-management:test906-login .'
          sg docker -c 'docker run --init --rm --network none --add-host chatgpt.com:127.0.0.1 anet-provider-management:test906-login'
  store:
    name: daemon-provider-store (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Private daemon configuration and isolation tests
        run: |
          sg docker -c 'docker build -f tests/test906-daemon-provider-management/Dockerfile -t anet-provider-management:test906 .'
          sg docker -c 'docker run --rm anet-provider-management:test906'
      - name: Compiled CLI roundtrip (offline)
        run: |
          sg docker -c 'docker build -f tests/test906-daemon-provider-management/Dockerfile.cli -t anet-provider-management:test906-cli .'
          sg docker -c 'docker run --rm --network none anet-provider-management:test906-cli'
      - name: Hub and daemon scoped readback (offline)
        run: |
          sg docker -c 'docker build -f tests/test906-daemon-provider-management/Dockerfile.transport -t anet-provider-management:test906-transport .'
          sg docker -c 'docker run --rm --network none anet-provider-management:test906-transport'
  native-application:
    name: daemon-provider-native-application (Docker)
    needs: store
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Same-thread native Codex provider application (offline, TEST-ONLY)
        run: |
          sg docker -c 'docker build -f tests/test906-daemon-provider-management/Dockerfile.native -t anet-provider-management:test906-native .'
          # A real init reaps the detached tmux grandchildren; Bun PID 1 does not.
          sg docker -c 'docker run --init --rm --network none --add-host chatgpt.com:127.0.0.1 anet-provider-management:test906-native'
