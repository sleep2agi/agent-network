name: V1 shared Server feasibility (TEST-ONLY)
on:
  pull_request:
    paths:
      - 'tests/test1194-v1-shared-feasibility/**'
      - '.github/workflows/v1-shared-feasibility.yml'
      - 'agent-node/src/runtime/opencode-copresence/v1-checkpoint.ts'
      - 'agent-node/src/shared/opencode-preset.ts'
  workflow_dispatch:
permissions:
  contents: read
# #2136 —— 同一 PR 重新 push 时**取消上一轮还在排队的运行**。
# 2026-10-25 实测:一条 PR 反复 push 会留下 28 个过期 workflow 一直占着 runner 队列,
# 新提交反而排不上(当天三条 PR 全卡在 queued)。只在 pull_request 上取消:
# 主分支的 push 运行不取消 —— 那可能是发布/部署门。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        version: ['1.18.1', '1.18.34']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build pinned exact source/native fixture
        run: sg docker -c 'docker build --build-arg OPENCODE_VERSION=${{ matrix.version }} --build-arg SOURCE_COMMIT="$GITHUB_SHA" -f tests/test1194-v1-shared-feasibility/Dockerfile -t v1-shared-fixture .'
      - name: Native directory/session/MCP/attach/persistence and scratch rollback
        run: |
          set -euo pipefail
          sg docker -c 'docker run --rm --network none -e EXPECTED_SOURCE_COMMIT="$GITHUB_SHA" v1-shared-fixture' 2>&1 | tee report-test1194-${{ matrix.version }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TEST-ONLY-v1-shared-${{ matrix.version }}-${{ github.sha }}
          path: report-test1194-${{ matrix.version }}.txt
          if-no-files-found: warn
