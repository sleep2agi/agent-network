name: REST task API core
on:
  pull_request:
    paths:
      - 'server/src/auth.ts'
      - 'server/src/server.ts'
      - 'server/src/rest-identity.ts'
      - 'server/src/tools.ts'
      - 'tests/qa-hub-16-rest-task-api/**'
      - '.github/workflows/rest-task-api-core.yml'
  workflow_dispatch:
permissions:
  contents: read
# #2136 —— 同一 PR 重新 push 时**取消上一轮还在排队的运行**。
# 2026-10-25 实测:一条 PR 反复 push 会留下 28 个过期 workflow 一直占着 runner 队列,
# 新提交反而排不上(当天三条 PR 全卡在 queued)。只在 pull_request 上取消:
# 主分支的 push 运行不取消 —— 那可能是发布/部署门。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rest-task-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build isolated REST closure fixture
        run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -t rest-task-api-test -f tests/qa-hub-16-rest-task-api/Dockerfile .
      - name: Verify identity rejection, REST dispatch and bound node reply
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rest-task-results
          chmod 777 rest-task-results
          docker run --rm --init --network none -v "$PWD/rest-task-results:/app/docs/tests" rest-task-api-test | tee rest-task-results/output.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rest-task-api-results
          path: rest-task-results
