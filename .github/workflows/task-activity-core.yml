name: Exact task activity core
on:
  pull_request:
    paths:
      - 'server/src/task-activity*'
      - 'server/src/tools.ts'
      - 'server/src/db.ts'
      - 'server/src/scheduled-*.ts'
      - 'server/src/node-caller-identity-http.test.ts'
      - 'agent-node/src/task-runtime-evidence*'
      - 'agent-node/src/cli.ts'
      - 'tests/test1113-task-activity/**'
      - '.github/workflows/task-activity-core.yml'
permissions:
  contents: read
jobs:
  task-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -t task-activity-test -f tests/test1113-task-activity/Dockerfile .
      - run: docker run --rm --init --network none task-activity-test
