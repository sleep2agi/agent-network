name: dsh-commhub plugin tests

on:
  pull_request:
    paths:
      - "integrations/dsh-commhub/**"
      - ".github/workflows/dsh-commhub.yml"
  push:
    branches: [main]
    paths:
      - "integrations/dsh-commhub/**"
      - ".github/workflows/dsh-commhub.yml"

# #2136 —— 同一 PR 重新 push 时**取消上一轮还在排队的运行**。
# 2026-10-25 实测:一条 PR 反复 push 会留下 28 个过期 workflow 一直占着 runner 队列,
# 新提交反而排不上(当天三条 PR 全卡在 queued)。只在 pull_request 上取消:
# 主分支的 push 运行不取消 —— 那可能是发布/部署门。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  unit:
    name: dsh-commhub-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Core only: the tests exercise the hub client / node loop / tools against an
      # in-process fake hub. The DSH glue (src/plugin.mjs) is not imported, so no
      # @deepseek-ai packages are installed here.
      - run: npm test
        working-directory: integrations/dsh-commhub
