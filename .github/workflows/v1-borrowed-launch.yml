name: V1 borrowed launcher readiness
on:
  pull_request:
    paths:
      - 'agent-node/src/cli.ts'
      - 'agent-node/src/shared/opencode-borrowed-launch-health.ts'
      - 'agent-network/src/shared/opencode-borrowed-launch-health.ts'
      - 'agent-node/src/runtime/start-daemon.ts'
      - 'agent-node/src/runtime/opencode-start-completion*.ts'
      - 'agent-node/src/runtime/opencode-copresence/launcher-health*.ts'
      - 'agent-network/bin/cli.ts'
      - 'agent-node/src/runtime/opencode-copresence/v1-borrowed-cli*.ts'
      - 'agent-node/src/runtime/opencode-copresence/runtime.ts'
      - 'agent-node/src/runtime/opencode-backend.ts'
      - 'agent-node/src/runtime/opencode-copresence/reply-ownership.ts'
      - 'agent-node/src/runtime/opencode-copresence/v1-host-*.ts'
      - 'agent-node/src/runtime/opencode-copresence/v1-scoped-mcp.ts'
      - 'agent-node/src/runtime/opencode-copresence/v1-borrowed-admission.ts'
      - 'agent-node/src/runtime/opencode-copresence/v1-shared-read.ts'
      - 'agent-node/src/runtime/opencode-copresence/process-group.ts'
      - 'agent-node/src/runtime/opencode-acp/binary.ts'
      - 'deploy/node/opencode-v1-host/**'
      - 'tests/test1226-v1-borrowed-launch/**'
      - 'tests/test651-opencode-timeout-abort/**'
      - 'tests/test1194-v1-shared-feasibility/package-integrity.json'
      - '.github/workflows/v1-borrowed-launch.yml'
  workflow_dispatch:
permissions:
  contents: read
# #2136 —— 同一 PR 重新 push 时**取消上一轮还在排队的运行**。
# 2026-10-25 实测:一条 PR 反复 push 会留下 28 个过期 workflow 一直占着 runner 队列,
# 新提交反而排不上(当天三条 PR 全卡在 queued)。只在 pull_request 上取消:
# 主分支的 push 运行不取消 —— 那可能是发布/部署门。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  launcher-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        version: ['1.18.1', '1.18.34']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build pinned exact native fixture
        run: docker build --build-arg OPENCODE_VERSION=${{ matrix.version }} --build-arg SOURCE_COMMIT=${{ github.sha }} -f tests/test1226-v1-borrowed-launch/Dockerfile -t v1-borrowed-launch-test .
      - name: Actual launcher completion, native original replies and private tmux scope
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --init --network none -e EXPECTED_SOURCE_COMMIT=${{ github.sha }} v1-borrowed-launch-test 2>&1 | tee report-test1226-${{ matrix.version }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TEST-ONLY-v1-borrowed-launch-${{ matrix.version }}-${{ github.sha }}
          path: report-test1226-${{ matrix.version }}.txt
