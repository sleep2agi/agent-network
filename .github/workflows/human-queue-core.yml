name: Authenticated human queue core
on:
  pull_request:
    paths: ['agent-node/src/runtime/codex-app-server/**', 'agent-node/src/runtime/codex-app-server-bridge*', 'agent-node/src/inbox-dispatch*', 'agent-node/src/cli.ts', 'tests/test1138-human-queue/**', 'docs-site/docs/guide/agent-node.md', 'docs-site/docs/en/guide/agent-node.md', 'docs/tests/report-test1138*', 'docs/tests/report-test1141*', '.github/workflows/human-queue-core.yml']
  push:
    branches: [main]
    paths: ['agent-node/src/runtime/codex-app-server/**', 'agent-node/src/runtime/codex-app-server-bridge*', 'agent-node/src/inbox-dispatch*', 'agent-node/src/cli.ts', 'tests/test1138-human-queue/**', 'docs-site/docs/guide/agent-node.md', 'docs-site/docs/en/guide/agent-node.md', 'docs/tests/report-test1138*', 'docs/tests/report-test1141*', '.github/workflows/human-queue-core.yml']
permissions:
  contents: read
jobs:
  human-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -f tests/test1138-human-queue/Dockerfile -t human-queue .
      - run: docker run --rm --network none human-queue
