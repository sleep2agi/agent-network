# 2026-11-09 —— PR 分层第二刀：原来 16 个 lint/ratchet workflow 各占一台 runner（每个 ~2.3 分钟，
# 大部分时间花在排队和 checkout 上），runner 池同时只跑 1~2 个任务时，光 lint 就要排十几轮。
# 现在合成一个 job、一台机器顺序跑完；每一步都带 `if: !cancelled()`，一步红不会挡住后面的步骤，
# 所有失败一次看全。步骤命令逐字搬自原 workflow（步骤名前缀 [原文件名] 便于追溯），
# 触发：所有 PR（不加 paths —— 守卫自身不能被路径门控）+ push main。
# 两个 job：`lint (required)` = 原 10 个分支保护必过项（必过项改为这一个）；
# `lint (ratchets)` = 其余 ratchet/inventory（目前在 main 上就是红的，只报告不拦截，逐个修绿后再挪进 required）。
name: lint
on:
  pull_request: null
  push:
    branches:
    - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  required:
    name: lint (required)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - &id001
      uses: actions/checkout@v4
    - &id002
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - &id003
      run: pip install --quiet --require-hashes -r .github/scripts/requirements-workflow-structure.txt
    - name: '[action-pins] python3 .github/scripts/check-action-pins.py'
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/check-action-pins.py
    - name: '[copresence-profile-pin] python3 .github/scripts/check-copresence-profile-pin.py --selftest'
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/check-copresence-profile-pin.py --selftest
    - name: '[copresence-profile-pin] python3 .github/scripts/check-copresence-profile-pin.py'
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/check-copresence-profile-pin.py
    - name: '[doc-symbol-anchors] python3 .github/scripts/check-doc-symbol-anchors.py --selftest'
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/check-doc-symbol-anchors.py --selftest
    - name: '[doc-symbol-anchors] python3 .github/scripts/check-doc-symbol-anchors.py'
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/check-doc-symbol-anchors.py
    - name: '[home-path-baseline] python3 .github/scripts/check-home-path-baseline.py --selftest'
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/check-home-path-baseline.py --selftest
    - name: '[home-path-baseline] python3 .github/scripts/check-home-path-baseline.py'
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/check-home-path-baseline.py
    - name: '[l1-paths-sync] python3 .github/scripts/check-l1-paths-sync.py --selftest'
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/check-l1-paths-sync.py --selftest
    - name: '[l1-paths-sync] python3 .github/scripts/check-l1-paths-sync.py'
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/check-l1-paths-sync.py
    - name: '[lint-from-session] Run lint-no-hardcoded-from-session.py'
      if: ${{ !cancelled() }}
      run: python3 tests/scripts/lint-no-hardcoded-from-session.py
    - name: '[no-live-tokens] python3 .github/scripts/check-no-live-tokens.py --selftest'
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/check-no-live-tokens.py --selftest
    - name: '[no-live-tokens] python3 .github/scripts/check-no-live-tokens.py'
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/check-no-live-tokens.py
    - name: '[no-memory-slugs] Run check-no-memory-slugs.py'
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/check-no-memory-slugs.py .
    - name: '[public-script-safety] python3 .github/scripts/check-public-script-safety.py --selftest'
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/check-public-script-safety.py --selftest
    - name: '[public-script-safety] python3 .github/scripts/check-public-script-safety.py'
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/check-public-script-safety.py
    - name: '[qa-trigger-coverage] python3 .github/scripts/check-qa-trigger-coverage.py'
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/check-qa-trigger-coverage.py
    - name: '[query-token-ratchet] python3 .github/scripts/check-query-token-ratchet.py --selftest'
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/check-query-token-ratchet.py --selftest
    - name: '[query-token-ratchet] python3 .github/scripts/check-query-token-ratchet.py'
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/check-query-token-ratchet.py
  ratchets:
    name: lint (ratchets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - *id001
    - *id002
    - *id003
    - name: '[keyset-join] prove the gate can go red (must-fail fixtures)'
      if: ${{ !cancelled() }}
      continue-on-error: true  # report-only: a red ratchet shows as a warning, not a red main
      run: python3 scripts/check-keyset-join.py --selftest
    - name: '[keyset-join] forbid sort().join() key-set comparison'
      if: ${{ !cancelled() }}
