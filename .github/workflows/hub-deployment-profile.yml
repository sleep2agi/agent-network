name: Hub deployment profile
on:
  pull_request:
    paths:
      - 'deploy/hub/**'
      - 'tests/test906-hub-upgrade-preflight/**'
      - '.github/workflows/hub-deployment-profile.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/hub/**'
      - 'tests/test906-hub-upgrade-preflight/**'
      - '.github/workflows/hub-deployment-profile.yml'
permissions:
  contents: read
# #2136 —— 同一 PR 重新 push 时**取消上一轮还在排队的运行**。
# 2026-10-25 实测:一条 PR 反复 push 会留下 28 个过期 workflow 一直占着 runner 队列,
# 新提交反而排不上(当天三条 PR 全卡在 queued)。只在 pull_request 上取消:
# 主分支的 push 运行不取消 —— 那可能是发布/部署门。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  launcher:
    name: Hub deployment profile (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Exact runtime selection and rollback (no live Hub)
        run: >-
          sg docker -c 'docker build --network none
          -f tests/test906-hub-upgrade-preflight/Dockerfile.launcher
          -t hub-profile-check . && docker run --rm --network none hub-profile-check'
      # The separate offline DB migration probe requires an operator-owned
      # consistent backup. Never upload production data or credentials to CI.
