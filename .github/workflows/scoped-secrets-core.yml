name: Scoped secrets core
on:
  pull_request:
    paths:
      - 'server/src/scoped-secrets*'
      - 'server/src/tools.ts'
      - 'server/src/shared/scoped-secret*'
      - 'agent-network/src/scoped-secrets*'
      - 'agent-network/src/shared/scoped-secret*'
      - 'agent-network/bin/cli.ts'
      - 'agent-node/src/shared/scoped-secret*'
      - 'agent-node/src/runtime/scoped-secrets.ts'
      - 'agent-node/src/runtime/create-node-daemon.ts'
      - 'agent-node/src/cli.ts'
      - 'tests/test1053-scoped-secrets/**'
      - '.github/workflows/scoped-secrets-core.yml'
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build TEST-ONLY isolated core
        run: sg docker -c 'docker build -f tests/test1053-scoped-secrets/Dockerfile -t scoped-secrets-test .'
      - name: Persistence then authorized Daemon and real runtime child
        run: sg docker -c 'docker run --rm --network none scoped-secrets-test'
