version: "3.8"

# Codex Telegram Squad: 1 server + 1 commander + 5 codex + 5 minimax
# Usage: docker compose up -d
# Telegram: send messages to the bot, commander will dispatch to workers

x-common: &common
  build:
    context: ../..
    dockerfile: demos/codex-telegram-squad/Dockerfile.agent
  volumes:
    - ${HOME}/.codex:/root/.codex:ro
    - ${HOME}/.claude:/root/.claude:ro
  depends_on:
    server:
      condition: service_healthy
  restart: unless-stopped

services:
  # ── CommHub Server ──
  server:
    build:
      context: ../..
      dockerfile: demos/codex-telegram-squad/Dockerfile.server
    ports:
      - "9299:9200"
    environment:
      - COMMHUB_AUTH_TOKEN=${COMMHUB_AUTH_TOKEN:-squad-token}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9200/health"]
      interval: 3s
      timeout: 5s
      retries: 10

  # ── Commander: Codex + Telegram ──
  commander:
    <<: *common
    environment:
      - ALIAS=commander
      - RUNTIME=codex-sdk
      - MODEL=gpt-5.4
      - COMMHUB_URL=http://server:9200
      - COMMHUB_TOKEN=${COMMHUB_AUTH_TOKEN:-squad-token}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOW_USER=${TELEGRAM_ALLOW_USER:-7612221352}
      - TOOLS=Read,Write,Edit,Bash,Glob,Grep
      - SYSTEM_PROMPT=你是指挥室 commander，负责接收 Telegram 消息并分配任务给 worker-1 到 worker-10。收到任务后分析需求，选择合适的 worker 派发。

  # ── Codex Workers (1-5) ──
  worker-1:
    <<: *common
    environment:
      - ALIAS=worker-1
      - RUNTIME=codex-sdk
      - MODEL=gpt-5.4
      - COMMHUB_URL=http://server:9200
      - COMMHUB_TOKEN=${COMMHUB_AUTH_TOKEN:-squad-token}
      - TOOLS=Read,Write,Edit,Bash,Glob,Grep

  worker-2:
    <<: *common
    environment:
      - ALIAS=worker-2
      - RUNTIME=codex-sdk
      - MODEL=gpt-5.4
      - COMMHUB_URL=http://server:9200
      - COMMHUB_TOKEN=${COMMHUB_AUTH_TOKEN:-squad-token}
      - TOOLS=Read,Write,Edit,Bash,Glob,Grep

  worker-3:
    <<: *common
    environment:
      - ALIAS=worker-3
      - RUNTIME=codex-sdk
      - MODEL=gpt-5.4
      - COMMHUB_URL=http://server:9200
      - COMMHUB_TOKEN=${COMMHUB_AUTH_TOKEN:-squad-token}
      - TOOLS=Read,Write,Edit,Bash,Glob,Grep

  worker-4:
    <<: *common
    environment:
      - ALIAS=worker-4
      - RUNTIME=codex-sdk
      - MODEL=gpt-5.4
      - COMMHUB_URL=http://server:9200
      - COMMHUB_TOKEN=${COMMHUB_AUTH_TOKEN:-squad-token}
      - TOOLS=Read,Write,Edit,Bash,Glob,Grep

  worker-5:
    <<: *common
    environment:
      - ALIAS=worker-5
      - RUNTIME=codex-sdk
      - MODEL=gpt-5.4
      - COMMHUB_URL=http://server:9200
      - COMMHUB_TOKEN=${COMMHUB_AUTH_TOKEN:-squad-token}
      - TOOLS=Read,Write,Edit,Bash,Glob,Grep

  # ── MiniMax Workers (6-10) via Claude Agent SDK ──
  worker-6:
    <<: *common
    environment:
      - ALIAS=worker-6
      - RUNTIME=claude-agent-sdk
      - MODEL=claude-3-5-haiku-20241022
      - ANTHROPIC_BASE_URL=https://api.minimaxi.com/anthropic
      - ANTHROPIC_API_KEY=${MINIMAX_API_KEY}
      - COMMHUB_URL=http://server:9200
      - COMMHUB_TOKEN=${COMMHUB_AUTH_TOKEN:-squad-token}

  worker-7:
    <<: *common
    environment:
      - ALIAS=worker-7
      - RUNTIME=claude-agent-sdk
      - MODEL=claude-3-5-haiku-20241022
      - ANTHROPIC_BASE_URL=https://api.minimaxi.com/anthropic
      - ANTHROPIC_API_KEY=${MINIMAX_API_KEY}
      - COMMHUB_URL=http://server:9200
      - COMMHUB_TOKEN=${COMMHUB_AUTH_TOKEN:-squad-token}

  worker-8:
    <<: *common
    environment:
      - ALIAS=worker-8
      - RUNTIME=claude-agent-sdk
      - MODEL=claude-3-5-haiku-20241022
      - ANTHROPIC_BASE_URL=https://api.minimaxi.com/anthropic
      - ANTHROPIC_API_KEY=${MINIMAX_API_KEY}
      - COMMHUB_URL=http://server:9200
      - COMMHUB_TOKEN=${COMMHUB_AUTH_TOKEN:-squad-token}

  worker-9:
