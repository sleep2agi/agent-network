# Translation Pipeline Demo: 3 Agents chain-translate CN → EN → JP
# Usage: MINIMAX_API_KEY=sk-cp-xxx docker compose up
#
# What happens:
#   1. CommHub server starts
#   2. Three agents connect: 调度员 (dispatcher), 英文翻译 (EN translator), 日文翻译 (JP translator)
#   3. Seed sends Chinese text to 调度员
#   4. 调度员 → 英文翻译 → 调度员 → 日文翻译 → 调度员 → result

services:
  server:
    image: oven/bun:1
    working_dir: /app/server
    volumes:
      - ../../server:/app/server:ro
    command: bun run src/index.ts
    environment:
      - COMMHUB_AUTH_TOKEN=demo-translate-token
      - HOST=0.0.0.0
      - PORT=9200
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9200/health"]
      interval: 3s
      timeout: 2s
      retries: 10

  seed:
    image: curlimages/curl:latest
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - shared:/shared
    entrypoint: /bin/sh
    command: |
      -c '
      BASE=http://server:9200
      TOKEN=demo-translate-token

      REG=$$(curl -s -X POST $$BASE/api/auth/register \
        -H "Authorization: Bearer $$TOKEN" \
        -H "Content-Type: application/json" \
        -d "{\"username\":\"admin\",\"password\":\"admin123456\"}")

      NTOK=$$(echo "$$REG" | sed -n "s/.*\"network_token\":\"\([^\"]*\)\".*/\1/p")
      echo "$$NTOK" > /shared/ntok
      echo "=== Token: $$NTOK ==="

      echo "=== Waiting for agents ==="
      sleep 20

      echo "=== Sending translation task ==="
      curl -s -X POST $$BASE/mcp \
        -H "Authorization: Bearer $$NTOK" \
        -H "Content-Type: application/json" \
        -H "Accept: application/json" \
        -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-03-26\",\"capabilities\":{},\"clientInfo\":{\"name\":\"seed\",\"version\":\"1.0\"}}}"

      curl -s -X POST $$BASE/mcp \
        -H "Authorization: Bearer $$NTOK" \
        -H "Content-Type: application/json" \
        -H "Accept: application/json" \
        -d "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"send_task\",\"arguments\":{\"alias\":\"调度员\",\"task\":\"翻译任务：请把下面这段中文翻译成英文和日文。先发给英文翻译翻成英文，等英文结果回来后，再发给日文翻译翻成日文。最后把中文原文、英文、日文三个版本汇总给我。\\n\\n原文：人工智能正在改变我们的工作方式。未来，人类和 AI 将携手合作，创造更美好的世界。\",\"from_session\":\"seed\"}}}"

      echo ""
      echo "=== Task sent! Watch: docker compose logs -f dispatcher ==="
      '

  dispatcher:
    image: oven/bun:1
    working_dir: /app/agent-node
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ../../agent-node:/app/agent-node:ro
      - shared:/shared:ro
    entrypoint: /bin/sh
    command: |
      -c '
      while [ ! -f /shared/ntok ]; do sleep 1; done
      NTOK=$$(cat /shared/ntok)

      ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.minimaxi.com/anthropic} \
      ANTHROPIC_AUTH_TOKEN=${MINIMAX_API_KEY} \
      bun run src/cli.ts \
        --alias 调度员 \
        --runtime claude-agent-sdk \
        --hub http://server:9200 \
        --token "$$NTOK" \
        --prompt "你是翻译调度员。网络中有两个翻译 Agent：英文翻译（翻中→英）、日文翻译（翻英→日）。收到翻译任务后，先发给英文翻译，拿到英文结果后再发给日文翻译，最后汇总三个语言版本返回。"
      '
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.minimaxi.com/anthropic}

  en-translator:
    image: oven/bun:1
    working_dir: /app/agent-node
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ../../agent-node:/app/agent-node:ro
      - shared:/shared:ro
    entrypoint: /bin/sh
    command: |
      -c '
      while [ ! -f /shared/ntok ]; do sleep 1; done
      NTOK=$$(cat /shared/ntok)

      ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.minimaxi.com/anthropic} \
      ANTHROPIC_AUTH_TOKEN=${MINIMAX_API_KEY} \
      bun run src/cli.ts \
        --alias 英文翻译 \
        --runtime claude-agent-sdk \
        --hub http://server:9200 \
        --token "$$NTOK" \
        --prompt "你是英文翻译专家。收到中文文本后，只返回高质量的英文翻译，不要附加解释。"
      '
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.minimaxi.com/anthropic}

  jp-translator:
    image: oven/bun:1
    working_dir: /app/agent-node
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ../../agent-node:/app/agent-node:ro
      - shared:/shared:ro
    entrypoint: /bin/sh
    command: |
      -c '
      while [ ! -f /shared/ntok ]; do sleep 1; done
      NTOK=$$(cat /shared/ntok)

      ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.minimaxi.com/anthropic} \
      ANTHROPIC_AUTH_TOKEN=${MINIMAX_API_KEY} \
      bun run src/cli.ts \
        --alias 日文翻译 \
        --runtime claude-agent-sdk \
        --hub http://server:9200 \
        --token "$$NTOK" \
        --prompt "你是日文翻译专家。收到英文文本后，只返回高质量的日文翻译，不要附加解释。"
      '
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.minimaxi.com/anthropic}

volumes:
  shared:
